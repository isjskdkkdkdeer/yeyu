<!-- NOCTIS Logo 概念 A：N 的斜笔是一道昼夜分界线
  左竖笔 + 斜笔 + 右竖笔 = N；斜笔右下方淡淡鎏金 = 白天，左上方留黑 = 夜；
  右上金点是太阳，左下空心圆是月亮。概念稿，等 Ha 选方向后再出套件。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="140" viewBox="0 0 360 140">
  <defs>
    <g id="markA" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 76 L68 20 L88 20 L88 76 Z" fill="currentColor" fill-opacity="0.12" stroke="none"/>
      <path d="M28 76 V20 M28 76 L68 20 M68 20 V76" stroke-width="6"/>
      <circle cx="80" cy="30" r="3.5" fill="currentColor" stroke="none"/>
      <circle cx="14" cy="64" r="4.5" stroke-width="1.5"/>
    </g>
  </defs>
  <rect x="12" y="12" width="96" height="96" rx="18" fill="#0B0A08" stroke="#D8B56D" stroke-opacity=".35" stroke-width="0.75"/>
  <use href="#markA" x="12" y="12" color="#D8B56D"/>
  <use href="#markA" transform="translate(172,52) scale(0.1667)" color="#D8B56D"/>
  <rect x="252" y="12" width="96" height="96" rx="18" fill="#D8B56D"/>
  <use href="#markA" x="252" y="12" color="#0B0A08"/>
  <text x="60" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A4A6A5">黑底金色</text>
  <text x="180" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A4A6A5">16 px 小尺寸</text>
  <text x="300" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#A4A6A5">反白</text>
</svg>
