<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>夜语 · DạNgữ | Noctis Private Chat</title>
<style>
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", system-ui, sans-serif;
  --text-xs:.75rem; --text-sm:.875rem; --text-base:1rem; --text-md:1.125rem; --text-title:1.625rem;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
  --radius-control:12px; --radius-card:16px; --radius-pill:999px;
  --shadow-card:none; --shadow-float:0 12px 32px #0008;
  --ink:#F5F6F8; --warm:#D8B56D; --muted:#A4A6A5; --accent:#D8B56D; --strong:#D8B56D;
  --outer:#090B0E; --side:#090B0E; --chat:#090B0E; --paper:#101317; --line:#1A1F26;
  --soft:#181C22; --choice:#252019; --sent:#211C15; --received:#14181F;
  --arrow:#4E535C; --online:#46C69A;
}
* {box-sizing:border-box}
body {margin:0;font-size:var(--text-base);line-height:1.5;color:var(--ink);background:var(--outer)}
html,body{overscroll-behavior:none}
button,input {font:inherit}
button {color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible {outline:2px solid var(--accent);outline-offset:3px}
button svg {flex:none}
h1,h2,h3,p {margin:0}
small {color:var(--muted)}
[hidden] {display:none!important}
.shell {display:grid;grid-template-columns:304px minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); width:100%; height:100dvh; max-width:1680px;margin:auto;background:var(--chat)}
.node-status{grid-column:1/-1;display:flex;align-items:center;gap:7px;min-height:30px;padding:0 14px;background:#0B0E11;border-bottom:1px solid var(--line);color:#A4A6A5;font-size:11px;letter-spacing:.08em;white-space:nowrap;overflow:hidden}
.node-status i{width:7px;height:7px;flex:none;border-radius:50%;background:#D8B56D;box-shadow:0 0 8px rgba(216,181,109,.55);animation:node-pulse 2s ease-in-out infinite alternate}
.node-status b{color:#D8B56D;font-weight:650}
@keyframes node-pulse{from{opacity:.55}to{opacity:1}}
.handshake-backdrop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(9,11,14,.86);backdrop-filter:blur(8px)}
.handshake-card{width:min(420px,100%);background:#101317;border:1px solid #1A1F26;border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.handshake-card h1{font-size:17px;letter-spacing:.14em;margin:0 0 6px;color:var(--ink)}
.handshake-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
.handshake-card input{width:100%;box-sizing:border-box;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#090B0E;color:var(--ink);font:inherit;text-align:center}
.handshake-card input:focus{outline:2px solid var(--accent);outline-offset:1px}
.handshake-card button{width:100%;min-height:48px;margin-top:14px;border:1px solid #D8B56D;border-radius:12px;background:#D8B56D;color:#090B0E;font:inherit;font-weight:700;letter-spacing:.06em}
.handshake-card button:active{opacity:.85}
.message-shell.with-details {grid-template-columns:304px minmax(0,1fr) 272px}
.sidebar {display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--side);border-right:1px solid var(--line)}
.brand {display:flex;align-items:center;gap:12px;padding:25px 22px 24px}
.brand-icon {display:grid;place-items:center;background:var(--strong);color:var(--outer);width:42px;height:42px;border-radius:13px}
.brand-icon svg {width:28px;height:28px}
.brand strong {display:block;font-size:var(--text-md);line-height:1.35}
.brand b {color:var(--accent)}
.brand small,.chat-title small,.thread-copy small,.thread-meta small,.sidebar-person small,.person-row small,.post-author small,.profile-card small {display:block}
.brand small {margin-top:2px;font-size:var(--text-xs)}
.list-heading {display:flex;align-items:center;justify-content:space-between;margin:9px 19px 13px 22px}
h1 {font-size:var(--text-title);line-height:1.25;font-weight:750}
.icon-button {display:inline-grid;place-items:center;width:40px;height:40px;border-radius:11px;color:var(--accent);flex:none}
.icon-button[aria-pressed=true] {background:var(--soft)}
.add {background:var(--choice);width:36px;height:36px}
.search {display:flex;align-items:center;gap:8px;margin:0 17px;padding:0 10px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.search svg {width:19px;flex:none}
input {min-width:0;border:0;background:none;color:var(--ink);font-size:16px}
input::placeholder {color:var(--muted);opacity:1}
.search input {width:100%;font-size:var(--text-base)}
.filters {display:flex;gap:7px;padding:14px 17px 10px}
.filters button,.language-buttons button {padding:7px 13px;border-radius:8px;color:var(--muted);font-size:13px}
.filters .on,.language-buttons [aria-pressed=true] {background:var(--choice);color:var(--strong);font-weight:700}
.threads {min-height:0;overflow:auto;flex:1;padding:0 10px 10px}
.threads,.timeline,.details,.section-page,.caption-scroll,.message-scan{-webkit-overflow-scrolling:touch}
.thread {width:100%;display:flex;align-items:center;text-align:start;gap:11px;padding:11px 10px;margin:3px 0;border:1px solid transparent;border-radius:var(--radius-control)}
.thread.current {background:var(--choice);border-color:var(--line);box-shadow:inset 3px 0 var(--accent)}
.avatar {position:relative;display:grid;place-items:center;width:45px;height:45px;border-radius:50%;flex:none;font-size:18px;font-weight:750;overflow:hidden; background:#d3e9dc;color:#205d49}
.avatar.rose {background:#edddd4;color:#794431}
.avatar.sand {background:#f0e3c8;color:#6a5324}
.avatar.lilac {background:#e8e0f3;color:#604488}
.avatar img {position:absolute;width:100%;height:100%;object-fit:cover;inset:0;outline:1px solid oklch(1 0 0 / 0.1);outline-offset:-1px}
.avatar.small {width:40px;height:40px}
.avatar.tiny {width:32px;height:32px;font-size:14px}
.avatar.large {width:78px;height:78px;font-size:27px}
.thread-copy {flex:1;min-width:0}
.thread-copy strong {font-size:var(--text-base);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-copy small {font-size:var(--text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.thread-meta {align-self:flex-start;text-align:right}
.thread-meta small {font-size:var(--text-xs);white-space:nowrap;margin:2px 0 5px}
.thread-meta b {display:inline-grid;place-items:center;background:var(--accent);color:#fff;font-size:var(--text-xs);border-radius:10px;min-width:17px;height:17px}
.empty {padding:20px;color:var(--muted)}
.nav {margin-top:auto;padding:8px 7px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);background:var(--side)}
.nav button {border-radius:9px; min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:5px 0;color:var(--muted);font-size:var(--text-xs);white-space:nowrap}
.nav button.selected {background:var(--choice);color:var(--strong)}
.nav button.selected {font-weight:750}
.chat-panel {display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chat)}
.chat-header,.section-header {min-height:75px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 23px}
.chat-title {flex:1;min-width:0}
.chat-title strong,.chat-title small {white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-title small {font-size:12px;margin-top:3px}
.head-actions {display:flex;gap:5px}
.back,.dismiss {display:none}
.chat-notice,.section-notice {color:var(--strong);background:var(--soft);display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;font-size:12px;text-align:center}
.chat-notice svg,.section-notice svg {width:15px;height:15px;flex:none}
.timeline {flex:1;min-height:0;overflow:auto;padding:13px 25px 14px;scrollbar-color:var(--line) transparent}
.date-divider {display:flex;align-items:center;gap:12px;justify-content:center;margin:3px auto 16px;color:var(--muted);font-size:12px}
.date-divider span {background:var(--soft);border-radius:20px;padding:5px 10px}
.message {display:flex;align-items:flex-start;gap:8px;margin:0 0 12px}
.message.own {justify-content:flex-end}
.message-content {max-width:min(87%,530px);min-width:0}
.sender {display:block;font-size:12px;margin:0 0 4px 3px}
.bubble {border:1px solid #1E242D;border-radius:5px 16px 16px 16px;padding:10px 13px;background:var(--received);font-size:var(--text-base);line-height:1.55;overflow-wrap:anywhere}
.own .bubble {background:var(--sent);border-radius:16px 5px 16px 16px}
.translation {display:flex;align-items:flex-start;gap:7px;color:var(--muted);font-size:var(--text-sm);line-height:1.55;border-top:1px solid var(--line);margin-top:8px;padding-top:7px}
.translation svg,.composer-note svg,.detail-foot svg,.text-button svg {width:15px;height:15px;flex:none}
.translation svg {margin-top:2px;color:var(--accent)}
.message time {display:block;margin:4px 2px 0;font-size:var(--text-xs);color:var(--muted)}
.own time {text-align:right}
.composer {position:relative;background:var(--paper);border-top:1px solid var(--line);padding:13px 22px max(12px,env(safe-area-inset-bottom))}
.quick-phrases{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin-bottom:8px;padding:2px 16px 2px 2px;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent 100%)}
.quick-phrases::-webkit-scrollbar{display:none}
.quick-phrases button{flex-shrink:0;background:#101317;border:1px solid #1A1F26;color:#A4A6A5;border-radius:999px;font-size:12px;line-height:1;padding:8px 12px;white-space:nowrap}
.quick-phrases button:active{border-color:#D8B56D}
.translate-page{background:#090B0E;overflow:hidden;display:flex;flex-direction:column}
.translate-page .section-header{background:transparent;border-bottom:0}
.translate-page .section-content{flex:1;min-height:0;max-width:none;margin:0;padding:0;overflow:hidden;background:#090B0E}
.interpret-top{position:relative;justify-content:center}
.interpret-status{font-size:12px;letter-spacing:4px;color:rgba(216,181,109,.5);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.interpret-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#6E737B;opacity:.55;padding:8px;display:grid;place-items:center}
.interpret-clear svg{width:16px;height:16px}
.interpret-neo{flex:1;min-height:0;display:flex;flex-direction:column;background:#090B0E;color:#fff;position:relative}
.interpret-neo .interpret-form{display:none}
.neo-half{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 24px}
.neo-mine{padding-bottom:112px}
.neo-stream{display:flex;flex-direction:column;gap:32px;width:100%}
.neo-line{overflow-wrap:anywhere}
.neo-src{margin:0;font-size:20px;line-height:1.6;font-weight:600}
.neo-trans{margin:8px 0 0;font-size:14px;line-height:1.6}
.neo-peer .neo-src{color:#E5E7EB;text-shadow:0 0 22px rgba(229,231,235,.14),0 2px 12px rgba(0,0,0,.6)}
.neo-peer .neo-trans{color:#D8B56D;text-shadow:0 0 14px rgba(216,181,109,.12)}
.neo-mine .neo-src{color:#fff;text-shadow:0 0 22px rgba(255,255,255,.14),0 2px 12px rgba(0,0,0,.6)}
.neo-mine .neo-trans{color:#9CA3AF;text-shadow:0 0 14px rgba(156,163,175,.12)}
.neo-peer .neo-line{transform:rotate(180deg)}
.neo-old{opacity:.5}
.neo-old .neo-src{font-size:16px}
.neo-old .neo-trans{font-size:12px}
.neo-latest .neo-src{animation:neo-breathe 4s ease-in-out infinite}
.neo-latest .neo-trans{font-size:20px;color:#E8C97A;text-shadow:0 0 18px rgba(232,201,122,.18)}
.neo-ms{display:inline-block;margin-top:10px;font-size:10px;line-height:1;color:#D8B56D;border:1px solid rgba(216,181,109,.35);border-radius:999px;padding:4px 8px;letter-spacing:.1em}
.neo-type{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(24px,env(safe-area-inset-bottom)) + 76px);width:min(92vw,420px);z-index:6;background:rgba(16,19,23,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(216,181,109,.35);border-radius:16px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.neo-type[hidden]{display:none}
.neo-type-row{display:flex;gap:8px;align-items:center}
.neo-type input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:15px;padding:8px 4px}
.neo-type input::placeholder{color:#6E737B}
.neo-type-send{flex:none;background:#D8B56D;color:#090B0E;border:0;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}
.neo-type-close{flex:none;background:transparent;border:0;color:#6E737B;font-size:18px;padding:4px 6px;line-height:1}
.neo-type-preset{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.neo-type-preset button{background:transparent;border:1px solid rgba(216,181,109,.3);color:#D8B56D;border-radius:999px;padding:5px 10px;font-size:12px}
@keyframes neo-breathe{0%,100%{text-shadow:0 0 16px rgba(255,255,255,.10),0 2px 12px rgba(0,0,0,.6)}50%{text-shadow:0 0 30px rgba(255,255,255,.24),0 2px 12px rgba(0,0,0,.6)}}
.neo-pending{margin:6px 0 0;font-size:13px;color:#6E737B}
.neo-empty-state{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:2;transition:opacity .45s ease;animation:neo-empty-breathe 3.6s ease-in-out infinite}
.neo-empty-state p{margin:0;color:#4B5563;font-size:13px;line-height:1.9;letter-spacing:.04em}
.neo-empty-state .empty-listen{display:none}
.neo-empty-state.is-listening .empty-guide{display:none}
.neo-empty-state.is-listening .empty-listen{display:block}
.neo-empty-state.is-listening p{color:#9CA3AF}
.neo-empty-state.is-listening{animation-duration:1.8s}
.neo-empty-state.is-hidden{opacity:0;animation:none}
@keyframes neo-empty-breathe{0%,100%{opacity:.55}50%{opacity:1}}
.neo-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:max(24px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:5}
.neo-dir{flex:none;background:transparent;border:1px solid rgba(255,255,255,.18);color:#E5E7EB;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:500;white-space:nowrap}
.neo-mic{position:relative;width:56px;height:56px;flex:none;border-radius:50%;border:1px solid rgba(216,181,109,.55);background:radial-gradient(circle at 50% 35%,#2A2F36 0%,#0D1013 55%,#090B0E 100%);color:#D8B56D;display:grid;place-items:center;animation:neo-glow 3.2s ease-in-out infinite}
.neo-mic svg{width:24px;height:24px}
.neo-mic.holding{border-color:#D8B56D;color:#fff;animation:none;box-shadow:0 0 0 1px rgba(216,181,109,.35),0 0 26px rgba(216,181,109,.45)}
@keyframes neo-glow{0%,100%{box-shadow:0 0 0 1px rgba(216,181,109,.12),0 0 14px rgba(216,181,109,.15)}50%{box-shadow:0 0 0 1px rgba(216,181,109,.28),0 0 24px rgba(216,181,109,.32)}}
.neo-mic.tapped::after{content:'';position:absolute;inset:-7px;border:1px solid rgba(216,181,109,.65);border-radius:50%;pointer-events:none;animation:neo-ripple .65s ease-out forwards}
@keyframes neo-ripple{from{transform:scale(.85);opacity:.9}to{transform:scale(1.5);opacity:0}}
.neo-mic.listening{border-color:#D8B56D;color:#fff;animation:neo-listen 1.6s ease-in-out infinite}
@keyframes neo-listen{0%,100%{box-shadow:0 0 0 1px rgba(216,181,109,.25),0 0 16px rgba(216,181,109,.3)}50%{box-shadow:0 0 0 1px rgba(216,181,109,.5),0 0 30px rgba(216,181,109,.55)}}
.translate-mic-btn.is-speaking{animation:goldPulse 1.2s infinite ease-in-out;box-shadow:0 0 20px rgba(216,181,109,.4)}
@keyframes goldPulse{0%,100%{border-color:rgba(216,181,109,.4);transform:scale(1)}50%{border-color:rgba(216,181,109,1);transform:scale(1.05)}}
.composer form,.comment-area form {display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:16px;background:var(--chat);padding:4px}
.composer input,.comment-area input {flex:1;width:0;padding:8px 4px}
.send,.primary {background:var(--strong);color:var(--outer);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;font-weight:700}
.send {padding:0;width:43px;height:39px;flex:none}
.composer-note {display:flex;justify-content:space-between;gap:6px;margin:7px 4px 0;color:var(--muted);font-size:var(--text-xs)}
.composer-note span,.detail-foot {display:flex;align-items:center;gap:5px}
.composer-note b {color:var(--accent)}
.emoji-picker {position:absolute;bottom:100%;left:22px;display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 5px 20px #0001}
.emoji-picker button {font-size:22px;padding:6px}
.details {background:var(--paper);border-left:1px solid var(--line);min-height:0;overflow:auto;overscroll-behavior:contain}
.details-heading {min-height:75px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 17px;color:var(--accent)}
.details-heading h2 {font-size:15px;color:var(--ink)}
.details-profile {display:flex;flex-direction:column;align-items:center;gap:7px;padding:26px 10px 16px;text-align:center}
.details-profile strong {margin-top:5px;font-size:17px}
.details-profile>span:not(.avatar) {font-size:13px;color:var(--muted)}
.details-profile small {background:var(--soft);padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;font-size:var(--text-xs)}
.details-profile i {width:6px;height:6px;border-radius:50%;background:var(--accent)}
.detail-actions {display:flex;justify-content:center;gap:23px;padding:0 10px 22px}
.detail-actions button {display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted)}
.detail-actions span,.setting-icon {display:grid;place-items:center;background:var(--soft);color:var(--accent);border-radius:10px;width:39px;height:39px}
.detail-settings {border-block:1px solid var(--line);padding:18px 15px 16px}
.detail-settings h3 {font-size:13px;margin:0 0 11px}
.setting {display:flex;align-items:center;gap:7px;background:var(--side);padding:8px;border-radius:18px}
.setting-icon {width:31px;height:31px}
.setting-icon svg {width:17px}
.setting div {flex:1;min-width:0}
.setting strong,.setting small {display:block;font-size:12px}
.setting small {margin-top:3px;font-size:var(--text-xs)}
.switch {width:34px;height:20px;border-radius:20px;background:#75837e;padding:3px;display:flex;flex:none}
.switch::before {content:"";width:14px;height:14px;border-radius:50%;background:white}
.switch.checked {background:var(--accent);justify-content:flex-end}
.detail-foot {font-size:var(--text-xs);color:var(--muted);padding:17px}
.sidebar-person {display:flex;align-items:center;gap:10px;margin:14px 17px;padding:12px;border-radius:13px;background:var(--choice)}
.sidebar-person small {font-size:12px;margin-top:4px}
.section-page {min-width:0;overflow:auto}
.section-header {position:sticky;top:0;z-index:1;color:var(--accent)}
.section-header h1 {color:var(--ink)}
.section-content {max-width:760px;margin:auto;padding:22px}
.section-notice {border-radius:10px;margin-bottom:14px}
.card {background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-card);margin-bottom:var(--space-4);box-shadow:var(--shadow-card)}
.person-row,.profile-card,.post-author {display:flex;align-items:center;gap:11px;padding:13px}
.people-cards{display:grid;gap:14px}
@media (min-width:700px){.people-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.people-card{padding:18px;background:#101317;border:1px solid #1A1F26;border-radius:18px}
.people-card-head{display:flex;align-items:center;gap:12px}
.people-card-head>div{flex:1;min-width:0}
.people-card-head strong{display:block;font-size:16px}
.people-card-head small{color:var(--muted)}
.people-card-role{margin:12px 0 4px;color:var(--ink);font-weight:650}

avatarPicker.addEventListener('change', () => {
  const file = avatarPicker.files && avatarPicker.files[0];
  avatarPicker.value = '';
  if (!file || !avatarTarget) return;
  const target = avatarTarget;
  avatarTarget = null;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 256 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => {
        if (!blob) { notify(t('图片读取失败，请换一张试试', 'Không đọc được ảnh, thử ảnh khác')); return; }
        const next = new FileReader();
        next.onload = () => {
          const url = String(next.result || '');
          if (!url.startsWith('data:image/')) return;
          if (target.kind === 'me') {
            demoProfile.avatarUrl = url;
            saveMyProfile();
          } else {
            const person = find(target.id);
            if (!person) return;
            person.avatarUrl = url;
            saveFriendOverrides(person);
          }
          pendingProfileForm = collectMyProfileForm();
          pendingFriendForm = collectFriendForm();
          render();
          fillMyProfileForm(pendingProfileForm);
          fillFriendForm(pendingFriendForm);

        };
        next.readAsDataURL(blob);
      }, 'image/jpeg', 0.85);
    };
    img.onerror = () => notify(t('图片读取失败，请换一张试试', 'Không đọc được ảnh, thử ảnh khác'));
    img.src = String(reader.result || '');
  };

function playOrStopVoice(control) {

  }
  const message=messages(find(state.active))[Number(playVoice)];
  if(!message?.[5]?.voice) return;
  const [lang,original,translation]=message;
  const translated=voiceTrack==='translated';
  const spokenLang=translated?otherLanguage(lang):lang;
  const voice=localVoices[spokenLang];
  const text=translated?translation:original;
  if(!voice || !text || (translated && state.translationErrors[state.active+':'+playVoice])) return;

  if(activeVoiceTrack) {

  save('history',state.history);
  render();
  timer=setInterval(updateCall,500);
  if(rtcAdapter) void connectRtc(state.call,rtcAdapter);
  return true;
}
function closeCall() {
  const call=state.call;
  if(!call) return;
  clearInterval(timer);
  const elapsed=Math.floor((Date.now()-call.start)/1000);
  const times=call.kind==='voice'?call.voiceTimes:Array.from({length:1+Math.floor(elapsed/4)},(_,index)=>index*4);
  const turns=call.rtcMode?sortedCaptions(call).map(item=>{
    const offset=item.timestamp>=1e12?item.timestamp-call.start:item.timestamp;
    return [Math.max(0,Math.floor(offset/1000)),/\p{Script=Han}/u.test(item.sourceText)?'zh':'vi',item.sourceText,item.translatedText];
  }):times.map((time,index)=>[time,...lines[index%lines.length]]);
  state.pendingTranscript=state.titanium.cache==='discard' || !turns.length?null:{person:call.person,kind:call.kind,turns,live:call.rtcMode};
  state.call=null;
  state.prompter={open:false,cat:'ice',active:null};
  releaseRtc(call);
  render({preserve:true});
}

let audioUnlocked=false;
function unlockIOSAudio(){
  if(audioUnlocked) return;
  try{
    if('speechSynthesis' in globalThis){
      const u=new SpeechSynthesisUtterance(' ');
      u.volume=0.01;
      globalThis.speechSynthesis.speak(u);
    }
    const AC=globalThis.AudioContext||globalThis.webkitAudioContext;
    if(AC){
      const ctx=new AC();
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      gain.gain.value=0.01;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(0);
      osc.stop(0.001);
    }
    audioUnlocked=true;
  }catch(e){ console.warn('Audio unlock err',e); }
}

function updateCall() {
  const call=state.call;
  if (!call) return;
  const elapsed=Math.floor((Date.now()-call.start)/1000);
  document.querySelector('#call-time').textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;
  if(call.rtcMode) {renderRtcCaptions(call);return;}
  let count=1+Math.floor(elapsed/4);
  if(call.kind==='voice') {
    if(!call.noise && !call.holding && call.mic && elapsed>=call.nextTurn) {
      call.voiceCount++;
      call.voiceTimes.push(elapsed);
      call.nextTurn=elapsed+4;
    }
    count=call.voiceCount;
    const [lang]=lines[(count-1)%lines.length];
    const turn=document.querySelector('#voice-language');
    if(turn) {
      const speaker=lang==='zh'?t('你','Bạn'):label(find(call.person));
      const status=call.holding?t('正在按住说话','Đang giữ để nói'):`${speaker} · ${t('识别','Nhận diện')} ${languageName(lang)}`;
      if(turn.textContent!==status) turn.textContent=status;
    }
  }
  if (!call.captions) return;
  const area=document.querySelector('.caption-scroll');
  const rows=document.querySelector('#caption-rows');
  const rendered=Number(rows.dataset.count || 0);
  if (rendered===count) {
    if(call.resumeFollow) { area.scrollTop=area.scrollHeight; call.resumeFollow=false; }
    return;
  }

  // Measure before appending so incoming lines do not change follow mode.
  const follow=call.resumeFollow || (!call.followPaused && (rendered ? captionsAtBottom(area) : call.captionPosition?.follow ?? true));
  call.resumeFollow=false;
  const markup=Array.from({length:count-rendered},(_,index)=>{
    const [lang,original,translation]=lines[(rendered+index)%lines.length];
    const [vi,zh]=lang==='vi'?[original,translation]:[translation,original];
    return `<div class="caption-pair"><p class="hud-source-text hud-source" lang="vi">${vi}</p><p class="hud-target-text hud-target" lang="zh-CN">${zh}</p></div>`;
  }).join('');
  rows.insertAdjacentHTML('beforeend',markup);
  rows.dataset.count=count;
  if (follow) area.scrollTop=area.scrollHeight;
  else if (!rendered) area.scrollTop=call.captionPosition?.top || 0;
}
function captionsAtBottom(area) {
  return area.scrollHeight-area.clientHeight-Math.max(0,area.scrollTop)<=4;
}

/* ---------- 聊天滚动：微信 / Telegram 式跟随与锚点 ---------- */
/* 唯一滚动入口：只有新消息到达、且用户正在底部附近（80px 内）时才跟随到底部；
   翻译状态、消息状态、组件重渲染一律不强制滚动，改用滚动锚点保持阅读位置。 */
const CHAT_FOLLOW_PX = 80;
let chatFollowing = true;

function isTimelineNearBottom(el, px = CHAT_FOLLOW_PX) { return !el || (el.scrollHeight - el.scrollTop - el.clientHeight <= px); }
function timelineAnchor(el) {
  if (!el) return null;
  const top = el.getBoundingClientRect().top;
  const conversation = el.dataset?.conversation;
  for (const row of el.querySelectorAll('[data-mid]')) {
    const r = row.getBoundingClientRect();
    if (r.bottom > top + 1) return { mid: row.dataset.mid, gap: r.top - top, scrollHeight: el.scrollHeight, scrollTop: el.scrollTop, conversation };
  }
  return { mid: null, gap: 0, scrollHeight: el.scrollHeight, scrollTop: el.scrollTop, conversation };
}
function restoreTimelineAnchor(el, anchor, fallbackTop) {
  if (!el) return;
  if (anchor?.mid) {
    const row = el.querySelector('[data-mid="' + CSS.escape(anchor.mid) + '"]');
    if (row) { el.scrollTop = Math.max(0, el.scrollTop + (row.getBoundingClientRect().top - el.getBoundingClientRect().top) - anchor.gap); return; }
  }
  if (anchor) el.scrollTop = Math.max(0, anchor.scrollTop + (el.scrollHeight - anchor.scrollHeight));
  else if (typeof fallbackTop === 'number') el.scrollTop = fallbackTop;
}
function syncScrollToBottomButton(el) {
  if (!el) return;
  const wrap = el.querySelector('.scroll-to-bottom-wrap');
  if (!wrap) return;
  const show = el.scrollHeight - el.scrollTop - el.clientHeight > CHAT_FOLLOW_PX;
  wrap.classList.toggle('visible', show);
  const count = wrap.querySelector('.scroll-to-bottom-count');

function holdVoice(control, held, commit=false) {
  const call=state.call;
  if(!call || call.kind!=='voice' || (!call.mic && held) || call.holding===held) return;
  call.holding=held;
  control.setAttribute('aria-pressed',String(held));
  if(!held && commit && call.mic) {
    call.voiceCount++;
    const elapsed=Math.floor((Date.now()-call.start)/1000);
    call.voiceTimes.push(elapsed);
    call.nextTurn=elapsed+4;
  }
  updateCall();
}
root.addEventListener('pointerdown',event=>{

});
for(const type of ['pointerup','pointercancel','lostpointercapture']) root.addEventListener(type,event=>{
  const control=event.target.closest('[data-hold-talk]');
  if(control) holdVoice(control,false,type==='pointerup');
});
let interpretRecognition=null;
let interpretHoldButton=null;
let interpretTapMode=false;
let interpretDownAt=0;
function stopInterpretRecognition() {
  if(interpretRecognition) { try { interpretRecognition.stop(); } catch {} interpretRecognition=null; }
  if(interpretHoldButton) { interpretHoldButton.classList.remove('holding'); interpretHoldButton.classList.remove('listening'); interpretHoldButton=null; }
  interpretTapMode=false;
  const empty=document.querySelector('.neo-empty-state');
  if(empty) empty.classList.remove('is-listening');
}
root.addEventListener('pointerdown',event=>{
  const control=event.target.closest('[data-interpret-hold]');
  if(!control || event.button!==0) return;
  unlockIOSAudio();
  if(interpretRecognition) { stopInterpretRecognition(); return; }
  const SpeechRecognition=globalThis.SpeechRecognition || globalThis.webkitSpeechRecognition;
  if(!SpeechRecognition) { state.interpretTyping=true; render({preserve:true}); notify(t('当前浏览器不支持语音识别，请打字输入','Trình duyệt này không hỗ trợ nhận diện giọng nói, hãy nhập văn bản')); return; }
  try { if(navigator.vibrate) navigator.vibrate(20); } catch {}
  control.classList.add('tapped');
  setTimeout(()=>{ control.classList.remove('tapped'); },650);
  control.setPointerCapture(event.pointerId);
  const side=control.dataset.interpretHold;
  stopInterpretRecognition();
  interpretDownAt=Date.now();
  const empty=document.querySelector('.neo-empty-state');
  if(empty) empty.classList.add('is-listening');
  const recognition=new SpeechRecognition();
  recognition.lang=side==='peer'?'vi-VN':'zh-CN';
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  recognition.onresult=event=>{
    const text=[...event.results].map(r=>r[0]?.transcript || '').join('').trim();
    if(!text) return;
    const form=document.querySelector(`.interpret-form[data-interpret-form="${side}"]`);
    if(form) { form.elements.interpret.value=text; form.requestSubmit(); }
  };
  recognition.onend=()=>{ stopInterpretRecognition(); };
  recognition.onerror=(event)=>{
    const err=event && event.error;
    const realErr=err && err!=='no-speech' && err!=='aborted';
    if(realErr){
      const msgs={
        'not-allowed':['麦克风权限被拒绝，请在浏览器设置里允许使用麦克风','Microphone permission denied'],
        'audio-capture':['没有检测到麦克风','No microphone detected'],
        'service-not-allowed':['语音识别服务不可用','Speech recognition unavailable'],
        'network':['网络不通，语音识别失败','Network error, speech recognition failed']
      };
      const m=msgs[err];
      if(m) notify(t(m[0],m[1]));
      else notify(t('语音识别启动失败','Speech recognition failed to start'));
    }
    stopInterpretRecognition();
    if(realErr){ state.interpretTyping=true; render({preserve:true}); }
  };
  try { recognition.start(); } catch { notify(t('语音识别启动失败','Speech recognition failed to start')); stopInterpretRecognition(); return; }
  interpretRecognition=recognition;
  interpretHoldButton=control;
  control.classList.add('holding');
  state.interpretTyping=false;
  const typeBox=document.querySelector('.neo-type');
  if(typeBox) typeBox.hidden=true;
});
root.addEventListener('click',event=>{ if(event.target.closest('[data-interpret-hold]')) unlockIOSAudio(); });
for(const type of ['pointerup','pointercancel','lostpointercapture']) root.addEventListener(type,event=>{
  const control=event.target.closest('[data-interpret-hold]');
  if(!control) return;
  if(type==='pointerup' && interpretRecognition && control===interpretHoldButton && Date.now()-(interpretDownAt||0)<300){
    interpretTapMode=true;
    control.classList.remove('holding');
    control.classList.add('listening');
    return;
  }
  stopInterpretRecognition();
});

root.addEventListener('change', event=>{

root.addEventListener('input', event => {

root.addEventListener('submit', event => {
  event.preventDefault();
  if(event.target.id==='friend-search') {
    state.friendQuery=event.target.elements.query.value;
    render({preserve:true});
  }
  if(event.target.id==='message-form') {
    const input=event.target.elements.message;
    const message=input.value.trim();
    if(!message) return;
    const match=phrases.find(pair=>pair.some(phrase=>phrase.toLowerCase()===message.replace(/[。！!?！.]+$/u,'').toLowerCase()));
    const lang=/\p{Script=Han}/u.test(message)?'zh':(match?'vi':state.lang);
    input.value='';
    const payload=translationPayload(find(state.active),message,lang);
    const key=JSON.stringify(payload.context);
    const cached=state.translationCache.find(row=>row[0]===lang&&row[1]===message&&row[3]===key);
    queueDemoMessage(message,lang,cached?.[2]||demoTranslation(payload),false,payload);
  }
  if(event.target.dataset.interpretForm) {
    const side=event.target.dataset.interpretForm;
    const input=event.target.elements.interpret;
    const text=input.value.trim();
    if(!text) return;
    const drafts=[...document.querySelectorAll('.interpret-form input')].map(el=>el===input?'':el.value);
    input.value='';
    const toLang=side==='peer'?'zh':'vi';
    const entry={src:text,trans:'',pending:true,time:clock()};
    (state.interpret[side] ||= []).push(entry);
    state.interpret[side]=state.interpret[side].slice(-20);
    save('interpret',state.interpret);
    render({preserve:true});
    document.querySelectorAll('.interpret-form input').forEach((el,i)=>{ el.value=drafts[i]||''; });
    const t0=performance.now();
    requestRelayTranslation({sourceText:text,toLang}).then(trans=>{
      entry.trans=trans; entry.pending=false; entry.ms=Math.round(performance.now()-t0);
      save('interpret',state.interpret);
      const now=[...document.querySelectorAll('.interpret-form input')].map(el=>el.value);
      render({preserve:true});
      document.querySelectorAll('.interpret-form input').forEach((el,i)=>{ el.value=now[i]||''; });
      if(trans && trans.trim() && state.tab==='translate') speakTranslation(trans, toLang);
    }).catch(()=>{
      entry.pending=false;
      save('interpret',state.interpret);
      render({preserve:true});
      notify(t('翻译失败，请重试','Dịch thất bại, thử lại'));
    });
  }
});
function installManifest() {
  if(!document.head || !/^https?:$/.test(platform.location?.protocol || '')) return;
  const start=new URL(platform.location.href);
  start.hash='';
  const scope=new URL('./',start);
  const icon='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#090B0E"/><path d="M122 170h268v150H240l-75 58v-58h-43z" fill="none" stroke="#D8B56D" stroke-width="18" stroke-linejoin="round"/><path d="M184 224h144m-144 43h104" stroke="#D8B56D" stroke-width="16" stroke-linecap="round"/></svg>';
  const manifest={
    id:start.pathname,name:brandName,short_name:'夜语',start_url:start.href,scope:scope.href,
    display:'standalone',orientation:'portrait',background_color:'#090B0E',theme_color:'#090B0E',
    icons:[{src:'data:image/svg+xml,'+encodeURIComponent(icon),sizes:'any',type:'image/svg+xml',purpose:'any'}]
  };
  const link=document.createElement('link');
  link.rel='manifest';link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
  document.head.append(link);
  const touchIcon=document.createElement('link');
  touchIcon.rel='apple-touch-icon';touchIcon.href=manifest.icons[0].src;
  document.head.append(touchIcon);
}
installManifest();
function keepComposerVisible() {
  const input=document.activeElement;
  if(!input?.matches?.('#message-form input')) {
    document.documentElement.style?.removeProperty('--chat-viewport-height');
    return;
  }
  const viewport=globalThis.visualViewport;
  if(viewport && matchMedia('(max-width: 768px), (max-width: 950px) and (pointer: coarse)').matches) {
    const height=Math.round(viewport.height+viewport.offsetTop);
    const composer=input.closest('.composer');
    const timeline=document.querySelector('.timeline');
    const follow=!!timeline && isTimelineNearBottom(timeline);
    document.documentElement.style?.setProperty('--chat-viewport-height',`${height}px`);
    const align=()=>{
      if(document.activeElement!==input) return;
      if(composer && composer.getBoundingClientRect().bottom>height+1) composer.scrollIntoView({block:'nearest',behavior:'auto'});
      if(follow && timeline) timeline.scrollTop=timeline.scrollHeight;
    };
    if(typeof platform.requestAnimationFrame==='function') platform.requestAnimationFrame(align); else align();
  }
}
