<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夜语">
<meta name="mobile-web-app-capable" content="yes">
<title>夜语 · DạNgữ | Noctis Private Chat</title>
<style>
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", system-ui, sans-serif;
  --text-xs:.75rem; --text-sm:.875rem; --text-base:1rem; --text-md:1.25rem; --text-title:1.625rem;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-7:32px;
  --radius-sm:8px; --radius-control:12px; --radius-card:16px; --radius-pill:999px;
  --shadow-card:none; --shadow-float:0 12px 32px #0008;
  --ink:#F5F6F8; --warm:#D8B56D; --muted:#A4A6A5; --accent:#D8B56D; --strong:#D8B56D;
  --outer:#0B0A08; --side:#0B0A08; --chat:#0B0A08; --paper:#171310; --line:rgba(216,181,109,.14);
  --soft:#211B16; --choice:#252019; --sent:#211C15; --received:#1A1512;
  --arrow:#4E535C; --online:#46C69A;
  /* DESIGN.md 语义别名（新代码用这一组，旧变量保留做兼容） */
  --bg:#0B0A08; --surface:#171310; --border:rgba(216,181,109,.14);
  --gold:#D8B56D; --gold-light:#E8C97A; --gold-dim:rgba(216,181,109,.5);
  --text:#F5F6F8; --text-dim:#9CA3AF;
}
* {box-sizing:border-box}
body {margin:0;font-size:var(--text-base);line-height:1.5;color:var(--ink);background:var(--outer)}
html,body{overscroll-behavior:none}
button,input {font:inherit}
button {color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible {outline:2px solid var(--accent);outline-offset:3px}
button svg {flex:none}
h1,h2,h3,p {margin:0}
small {color:var(--muted)}
[hidden] {display:none!important}
.shell {display:grid;grid-template-columns:304px minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); width:100%; height:100dvh; max-width:1680px;margin:auto;background:var(--chat)}
.node-status{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-height:30px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;letter-spacing:.08em;white-space:nowrap;overflow:hidden}
.node-status i{width:7px;height:7px;flex:none;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(216,181,109,.55);animation:node-pulse 2s ease-in-out infinite alternate}
.node-status b{color:var(--gold);font-weight:650}
@keyframes node-pulse{from{opacity:.55}to{opacity:1}}
.handshake-backdrop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(11,10,8,.86);backdrop-filter:blur(8px);transition:opacity .2s ease-out}
.handshake-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:28px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);transition:transform .2s ease-out,opacity .2s ease-out}
.handshake-card h1{font-size:var(--text-md);letter-spacing:.14em;margin:0 0 6px;color:var(--ink)}
.handshake-card p{margin:0 0 18px;color:var(--muted);font-size:var(--text-sm)}
.handshake-card input{width:100%;box-sizing:border-box;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.handshake-card input:focus{outline:2px solid var(--accent);outline-offset:1px}
.handshake-card button{width:100%;min-height:48px;margin-top:14px;border:1px solid var(--gold);border-radius:var(--radius-control);background:var(--gold);color:var(--bg);font:inherit;font-weight:700;letter-spacing:.06em}
.handshake-card button:active{opacity:.85}
/* 退出轻于进入：握手完成时整层淡出、卡片小幅下沉 */
.handshake-backdrop.handshake-leaving{opacity:0}
.handshake-backdrop.handshake-leaving .handshake-card{transform:translateY(8px);opacity:0}
/* 点阵金字：握手页 NOCTIS，点按列从左到右逐个点亮（只在握手入场时播） */
.dotword{width:min(240px,72%);margin:0 auto 12px}
.dotword svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 6px rgba(216,181,109,.35))}
@keyframes dot-light{from{opacity:.15}to{opacity:1}}
.handshake-staged .dot-lit{animation:dot-light .3s ease-out both}
/* 握手仪式三段入场：插画 → 点阵金字 → 表单，每段 150–250ms ease-out，只在首次出现 */
.handshake-staged .hs-stage{opacity:0;animation:hs-in .22s ease-out forwards}
.handshake-staged .hs-stage-1{animation-delay:.05s}
.handshake-staged .hs-stage-2{animation-delay:.18s}
.handshake-staged .hs-stage-3{animation-delay:.31s}
@keyframes hs-in{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.handshake-illust{display:grid;place-items:center;margin-bottom:4px}
.message-shell.with-details {grid-template-columns:304px minmax(0,1fr) 272px}
.sidebar {display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--side);border-right:1px solid var(--line)}
.brand {display:flex;align-items:center;gap:12px;padding:24px 24px}
.brand-icon {display:grid;place-items:center;background:var(--strong);color:var(--outer);width:42px;height:42px;border-radius:var(--radius-control)}
.brand-icon svg {width:28px;height:28px}
.brand strong {display:block;font-size:var(--text-md);line-height:1.35}
.brand b {color:var(--accent)}
.brand small,.chat-title small,.thread-copy small,.thread-meta small,.sidebar-person small,.person-row small,.post-author small,.profile-card small {display:block}
.brand small {margin-top:2px;font-size:var(--text-xs)}
.list-heading {display:flex;align-items:center;justify-content:space-between;margin:8px 20px 12px 24px}
h1 {font-size:var(--text-title);line-height:1.25;font-weight:750}
.icon-button {display:inline-grid;place-items:center;width:44px;height:44px;border-radius:var(--radius-control);color:var(--accent);flex:none}
.icon-button[aria-pressed=true] {background:var(--soft)}
.add {background:var(--choice);width:36px;height:36px}
.search {display:flex;align-items:center;gap:8px;margin:0 16px;padding:0 12px;height:42px;border-radius:var(--radius-control);border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.search svg {width:19px;flex:none}
input {min-width:0;border:0;background:none;color:var(--ink);font-size:var(--text-base)}
input::placeholder {color:var(--muted);opacity:1}
.search input {width:100%;font-size:var(--text-base)}
.filters {display:flex;gap:8px;padding:16px 16px 12px}
.filters button,.language-buttons button {padding:8px 12px;border-radius:var(--radius-sm);color:var(--muted);font-size:var(--text-sm)}
.filters .on,.language-buttons [aria-pressed=true] {background:var(--choice);color:var(--strong);font-weight:700}
.threads {min-height:0;overflow:auto;flex:1;padding:0 10px 10px}
.threads,.timeline,.details,.section-page,.caption-scroll,.message-scan{-webkit-overflow-scrolling:touch}
.thread {width:100%;display:flex;align-items:center;text-align:start;gap:12px;padding:11px 10px;margin:3px 0;border:1px solid transparent;border-radius:var(--radius-control)}
.thread.current {background:var(--choice);border-color:var(--line);box-shadow:inset 3px 0 var(--accent)}
/* 消息页时间锚：未读优先后，按今天 / 更早分组 */
.thread-anchor{display:flex;align-items:center;gap:8px;margin:10px 4px 6px;color:var(--gold-dim);font-size:11px;letter-spacing:.12em}
.thread-anchor::before{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(216,181,109,.3))}
.thread-anchor::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(216,181,109,.3),transparent)}
.thread-anchor span{white-space:nowrap}
.avatar {position:relative;display:grid;place-items:center;width:45px;height:45px;border-radius:50%;flex:none;font-size:var(--text-md);font-weight:750;overflow:hidden; background:#d3e9dc;color:#205d49}
.avatar.rose {background:#edddd4;color:#794431}
.avatar.sand {background:#f0e3c8;color:#6a5324}
.avatar.lilac {background:#e8e0f3;color:#604488}
.avatar img {position:absolute;width:100%;height:100%;object-fit:cover;inset:0;outline:1px solid oklch(1 0 0 / 0.1);outline-offset:-1px}
.avatar.small {width:40px;height:40px}
.avatar.tiny {width:32px;height:32px;font-size:var(--text-sm)}
.avatar.large {width:78px;height:78px;font-size:27px}
.thread-copy {flex:1;min-width:0}
.thread-copy strong {font-size:var(--text-base);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-copy small {font-size:var(--text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.thread-meta {align-self:flex-start;text-align:right}
.thread-meta small {font-size:var(--text-xs);white-space:nowrap;margin:2px 0 5px}
.thread-meta b {display:inline-grid;place-items:center;background:var(--accent);color:var(--text);font-size:var(--text-xs);border-radius:var(--radius-control);min-width:17px;height:17px}
.empty {padding:20px;color:var(--muted)}
.nav {margin-top:auto;padding:8px 7px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);background:var(--side)}
.nav button {border-radius:var(--radius-sm); min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:5px 0;color:var(--muted);font-size:var(--text-xs);white-space:nowrap}
.nav button.selected {background:var(--choice);color:var(--strong)}
.nav button.selected {font-weight:750}
.chat-panel {display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chat)}
.chat-header,.section-header {min-height:75px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.chat-title {flex:1;min-width:0}
.chat-title strong,.chat-title small {white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-title small {font-size:var(--text-xs);margin-top:3px}
.head-actions {display:flex;gap:5px}
.back,.dismiss {display:none}
.chat-notice,.section-notice {color:var(--strong);background:var(--soft);display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;font-size:var(--text-xs);text-align:center}
.chat-notice svg,.section-notice svg {width:15px;height:15px;flex:none}
.timeline {flex:1;min-height:0;overflow:auto;padding:12px 24px 16px;scrollbar-color:var(--line) transparent}
.date-divider {display:flex;align-items:center;gap:12px;justify-content:center;margin:3px auto 16px;color:var(--muted);font-size:var(--text-xs)}
.date-divider span {background:var(--soft);border-radius:var(--radius-card);padding:5px 10px}
.message {display:flex;align-items:flex-start;gap:8px;margin:0 0 12px}
/* 密度交替：换人说话的一组消息前留 24px 呼吸 */
.message-break{margin-top:24px}
.message.own {justify-content:flex-end}
.message-content {max-width:min(87%,530px);min-width:0}
.sender {display:block;font-size:var(--text-xs);margin:0 0 4px 3px}
.bubble {border:1px solid var(--border);border-radius:var(--radius-sm) var(--radius-card) var(--radius-card) var(--radius-card);padding:12px;background:var(--received);font-size:var(--text-base);line-height:1.55;overflow-wrap:anywhere}
.own .bubble {background:var(--sent);border-radius:var(--radius-card) var(--radius-sm) var(--radius-card) var(--radius-card)}
.translation {display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:var(--text-sm);line-height:1.55;border-top:1px solid var(--line);margin-top:8px;padding-top:7px}
.translation svg,.composer-note svg,.detail-foot svg,.text-button svg {width:15px;height:15px;flex:none}
.translation svg {margin-top:2px;color:var(--accent)}
.message time {display:block;margin:4px 2px 0;font-size:var(--text-xs);color:var(--muted)}
.own time {text-align:right}
.composer {position:relative;background:var(--paper);border-top:1px solid var(--line);padding:12px 24px max(12px,env(safe-area-inset-bottom))}
.quick-phrases{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin-bottom:8px;padding:2px 16px 2px 2px;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent 100%)}
.quick-phrases::-webkit-scrollbar{display:none}
.quick-phrases button{flex-shrink:0;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:var(--radius-pill);font-size:var(--text-xs);line-height:1;padding:8px 12px;white-space:nowrap}
.quick-phrases button:active{border-color:var(--gold)}

.composer form:focus-within,.comment-area form:focus-within{border-color:var(--gold)}
.search:focus-within{border-color:var(--gold)}
/* 图标情境动画：切换时图标从 0.25 缩放到 1、透明度 0 到 1、模糊 4px 到 0（bounce 0） */
@keyframes neo-icon-in{from{transform:scale(.25);opacity:0;filter:blur(4px)}to{transform:scale(1);opacity:1;filter:blur(0)}}
.icon-swap{animation:neo-icon-in .25s ease-out}
.empty-illust{text-align:center;padding-top:32px}
.empty-illust svg{display:block;margin:0 auto}
.empty-illust p{margin-top:12px}
.titanium-vip svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
/* 学语页：每日一句大卡（点一下翻面，0.22s 只动 transform/opacity；翻面时一道金线扫过） */
.learn-daily{position:relative;overflow:hidden;cursor:pointer;padding:20px}
.learn-daily .learn-daily-kicker{margin:0 0 12px;font-size:var(--text-xs);letter-spacing:4px;color:var(--gold-dim);text-transform:uppercase}
.learn-daily .learn-daily-main{margin:0;font-size:var(--text-md);line-height:1.6;font-weight:600;color:var(--text)}
.learn-daily .learn-daily-sub{margin:8px 0 0;font-size:var(--text-base);line-height:1.6;color:var(--gold-light)}
.learn-daily.learn-flipped .learn-daily-main{color:var(--gold)}
.learn-daily.learn-flipped .learn-daily-sub{color:var(--text)}
.learn-daily.learn-flipped .learn-daily-main,.learn-daily.learn-flipped .learn-daily-sub{animation:learn-flip .22s ease-out}
.learn-daily::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,rgba(216,181,109,.9),transparent);transform:translateX(-100%);pointer-events:none}
.learn-daily.learn-flipped::after{animation:learn-sweep .45s ease-out forwards}
@keyframes learn-flip{from{opacity:.4;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes learn-sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.learn-daily-foot{display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--muted);font-size:var(--text-xs)}
.learn-daily-foot .learn-speak{margin-left:auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid rgba(216,181,109,.4);color:var(--gold);background:transparent}
.learn-daily-foot .learn-speak svg{width:20px;height:20px}
.learn-daily-foot .learn-speak:active{background:rgba(216,181,109,.15)}
/* 学语页：词典 / 练一句输入行 + 结果卡 */
.learn-row{display:flex;gap:8px;align-items:center}
.learn-row input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);color:var(--text);font-size:var(--text-base);padding:12px;outline:0}
.learn-row input:focus{border-color:var(--gold)}
.learn-row input::placeholder{color:var(--muted)}
.learn-go{flex:none;background:var(--gold);color:var(--bg);border:0;border-radius:var(--radius-pill);padding:12px 16px;min-height:44px;font-size:var(--text-sm);font-weight:700}
.learn-result{margin-top:12px}
.learn-result .learn-word{margin:0;font-size:var(--text-md);font-weight:600;color:var(--text)}
.learn-result .learn-ipa{margin:4px 0 0;font-size:var(--text-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.learn-result .learn-zh{margin:8px 0 0;font-size:var(--text-base);line-height:1.6;color:var(--gold-light)}
.learn-result .learn-vi{margin:8px 0 0;font-size:var(--text-sm);line-height:1.6;color:var(--text-dim)}
.learn-result .learn-ex{margin:8px 0 0;font-size:var(--text-sm);line-height:1.6;color:var(--text)}
.learn-result .learn-ex li{margin-top:4px}
.learn-source{margin:8px 0 0;font-size:var(--text-xs);color:var(--muted)}
.learn-note{margin:12px 0 0;color:var(--muted);font-size:var(--text-sm)}
.learn-practice-result{cursor:pointer}
.learn-ms{display:inline-block;margin-top:10px;font-size:11px;line-height:1;color:var(--gold);border:1px solid rgba(216,181,109,.35);border-radius:var(--radius-pill);padding:4px 8px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
/* 口语陪练 D 路：每日一句下面、词典上面；只动 transform/opacity */
.tutor-card{padding:20px}
.tutor-kicker{margin:0 0 8px;font-size:var(--text-xs);letter-spacing:4px;color:var(--gold-dim);text-transform:uppercase}
.tutor-sub{margin:0;font-size:var(--text-sm);line-height:1.5;color:var(--muted)}
.tutor-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}
.tutor-status{display:flex;align-items:center;gap:8px;font-size:var(--text-sm);color:var(--text)}
.tutor-dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--gold-dim)}
.tutor-dot.is-live{background:var(--gold);box-shadow:0 0 8px rgba(216,181,109,.55);animation:tutor-pulse 1.2s ease-in-out infinite alternate}
@keyframes tutor-pulse{from{opacity:.45}to{opacity:1}}
.tutor-time{font-size:var(--text-sm);color:var(--gold);font-variant-numeric:tabular-nums}
.tutor-toggle{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:16px;background:var(--gold);color:var(--bg);border-radius:var(--radius-pill);font-size:var(--text-base);font-weight:700}
.tutor-toggle svg{width:20px;height:20px}
.tutor-captions{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.tutor-line{margin-top:12px}
.tutor-line:first-child{margin-top:0}
.tutor-who{display:block;font-size:var(--text-xs);color:var(--muted);margin-bottom:4px}
.tutor-user{margin:0;font-size:var(--text-base);line-height:1.6;color:var(--text)}
.tutor-tutor{margin:0;font-size:var(--text-md);line-height:1.6;color:var(--gold-light)}
.tutor-zh{margin:4px 0 0;font-size:var(--text-sm);line-height:1.6;color:var(--text-dim);animation:tutor-fade .2s ease-out}
.tutor-zh:empty{display:none}
.tutor-draft{opacity:.65}
.tutor-notice{margin:12px 0 0;font-size:var(--text-sm);line-height:1.6;color:var(--muted)}
.tutor-notice:empty{display:none}
@keyframes tutor-fade{from{opacity:0}to{opacity:1}}
/* 减弱动效：只保留透明度变化，去掉位移与缩放 */
@media (prefers-reduced-motion: reduce){
 .icon-swap{animation:none}
 .handshake-staged .hs-stage,.handshake-staged .dot-lit{animation:none;opacity:1}
 .relay-arc{animation:none}
 .learn-daily.learn-flipped .learn-daily-main,.learn-daily.learn-flipped .learn-daily-sub{animation:none}
 .learn-daily.learn-flipped::after{animation:none}
 .tutor-dot.is-live,.tutor-zh{animation:none}
}
.composer form,.comment-area form {display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--chat);padding:4px}
.composer input,.comment-area input {flex:1;width:0;padding:8px 4px}
.send,.primary {background:var(--strong);color:var(--outer);border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;font-weight:700}
.send {padding:0;width:44px;height:44px;flex:none}
/* 主按钮按压：90ms 压进 scale(0.96)，松手弹簧回弹约 450ms 带 1% 过冲 */
.send,.quick-phrases button,.prompter-item,.learn-go,.learn-speak,.tutor-toggle{transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.send:active,.quick-phrases button:active,.prompter-item:active,.learn-go:active,.learn-speak:active,.tutor-toggle:active{transform:scale(.96);transition-duration:90ms}
/* 光学对齐：纸飞机图标视觉重心偏左下，手动向右上挪 1px */
.send svg{transform:translate(1px,-1px)}
.composer-note {display:flex;justify-content:space-between;gap:6px;margin:7px 4px 0;color:var(--muted);font-size:var(--text-xs)}
.composer-note span,.detail-foot {display:flex;align-items:center;gap:5px}
.composer-note b {color:var(--accent)}

}

/* Clean-47 surfaces and rows */
html,body {background:var(--outer);overscroll-behavior:none}
body {overflow:hidden}
.section-page,.timeline,.threads {overscroll-behavior:contain}

/* 金句收藏：我的页横向滚动迷你卡，点一下重播读音 */

/* 插画规格：金色细线描边、黑底、一个金点缀；源文件在 assets/spotkit/ */
const DOT_FONT={
 N:['10001','11001','10101','10011','10001','10001','10001'],
 O:['01110','10001','10001','10001','10001','10001','01110'],
 C:['01110','10001','10000','10000','10000','10001','01110'],
 T:['11111','00100','00100','00100','00100','00100','00100'],
 I:['01110','00100','00100','00100','00100','00100','01110'],
 S:['01111','10000','10000','01110','00001','00001','11110']
};
function dotMatrixInner(word) {
  let out='';
  [...word].forEach((ch,li)=>{
    (DOT_FONT[ch]||[]).forEach((row,ri)=>{
      [...row].forEach((bit,ci)=>{
        if(bit!=='1') return;
        out+=`<circle class="dot-lit" cx="${li*42+ci*7+3.5}" cy="${ri*7+3.5}" r="2.2" fill="#D8B56D" style="animation-delay:${(li*6+ci)*14}ms"/>`;
      });
    });
  });
  return out;
}
function dotMatrixSVG(word='NOCTIS') {
  return `<svg class="dotword-svg" viewBox="0 0 245 49" role="img" aria-label="${word}" xmlns="http://www.w3.org/2000/svg">${dotMatrixInner(word)}</svg>`;
}
function spotkitSVG(inner,size=120,label='',sw=0.75) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" fill="none" stroke="#D8B56D" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${label}">${inner}</svg>`;
}
function spotkitPackSVG(inner,size=48,label='') {
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" fill="none" stroke="#D8B56D" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${label}">${inner}</svg>`;
}

function saveInlineProfileField() {
  if (!editingProfileField) return;
  const field = editingProfileField;
  editingProfileField = null;
  const genders = {'未填写':['未填写','Chưa cung cấp'],'男':['男','Nam'],'女':['女','Nữ']};

  else if (field==='gender') { const v=document.querySelector('#inline-profile-gender')?.value; demoProfile.gender=genders[v]||genders['未填写']; }
  else if (field==='region') {
    const zh=val('#inline-profile-region-zh'), vi=val('#inline-profile-region-vi');

// 换头像会整页重渲染，先把正在填的表单值暂存，渲染完再填回去，不然刚打的字会丢。
let pendingProfileForm = null;
let pendingFriendForm = null;
function collectMyProfileForm() {
  const name = document.querySelector('#edit-my-name');

  set('#edit-my-region-zh', v.regionZh); set('#edit-my-region-vi', v.regionVi);

const avatarPicker = document.createElement('input');
avatarPicker.type = 'file';
avatarPicker.id = 'avatar-picker';
avatarPicker.accept = 'image/*';
avatarPicker.hidden = true;
document.body.append(avatarPicker);
avatarPicker.addEventListener('change', () => {
  const file = avatarPicker.files && avatarPicker.files[0];
  avatarPicker.value = '';
  if (!file || !avatarTarget) return;
  const target = avatarTarget;
  avatarTarget = null;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 256 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => {
        if (!blob) { notify(t('图片读取失败，请换一张试试', 'Không đọc được ảnh, thử ảnh khác')); return; }
        const next = new FileReader();
        next.onload = () => {
          const url = String(next.result || '');
          if (!url.startsWith('data:image/')) return;
          if (target.kind === 'me') {
            demoProfile.avatarUrl = url;
            saveMyProfile();
          } else {
            const person = find(target.id);
            if (!person) return;
            person.avatarUrl = url;
            saveFriendOverrides(person);
          }
          pendingProfileForm = collectMyProfileForm();
          pendingFriendForm = collectFriendForm();
          render();
          fillMyProfileForm(pendingProfileForm);

  }
  const message=messages(find(state.active))[Number(playVoice)];
  if(!message?.[5]?.voice) return;
  const [lang,original,translation]=message;
  const translated=voiceTrack==='translated';
  const spokenLang=translated?otherLanguage(lang):lang;
  const voice=localVoices[spokenLang];
  const text=translated?translation:original;
  if(!voice || !text || (translated && state.translationErrors[state.active+':'+playVoice])) return;

  if(activeVoiceTrack) {
    voiceTrackResults.set(activeVoiceTrack.key,'stopped');
    activeVoiceTrack=null;
    voiceEngine.cancel();

  voiceTrackResults.delete(voiceKey);

  speech.voice=voice;
  speech.lang=voice.lang;

    activeVoiceTrack=null;

  speech.onstart=()=>{
    if(activeVoiceTrack!==play) return;
    play.started=true;
    playedVoiceTracks.add(voiceKey);
    refreshVoiceButtons();
  };

  speech.onerror=()=>finish(true);

function attachMessageTranslation(person,message,fallback,{followLatest=false}={}) {

    rtcMode:!!rtcAdapter,captionRevision:0,finalCaptions:new Map(),captionDrafts:new Map()};
  state.prompter={open:false,active:null};
  state.history.unshift({id:person,kind,time:clock()});
  state.history=state.history.slice(0,20);
  save('history',state.history);
  render();
  timer=setInterval(updateCall,500);
  if(rtcAdapter) void connectRtc(state.call,rtcAdapter);
  return true;
}
function closeCall() {
  const call=state.call;
  if(!call) return;
  clearInterval(timer);
  const elapsed=Math.floor((Date.now()-call.start)/1000);
  const times=call.kind==='voice'?call.voiceTimes:Array.from({length:1+Math.floor(elapsed/4)},(_,index)=>index*4);
  const turns=call.rtcMode?sortedCaptions(call).map(item=>{
    const offset=item.timestamp>=1e12?item.timestamp-call.start:item.timestamp;
    return [Math.max(0,Math.floor(offset/1000)),/\p{Script=Han}/u.test(item.sourceText)?'zh':'vi',item.sourceText,item.translatedText];
  }):times.map((time,index)=>[time,...lines[index%lines.length]]);
  state.pendingTranscript=state.titanium.cache==='discard' || !turns.length?null:{person:call.person,kind:call.kind,turns,live:call.rtcMode};
  state.call=null;
  state.prompter={open:false,active:null};
  releaseRtc(call);
  render({preserve:true});
}

async function downloadIdentityCard() {
  const svg=identityCardSVG();
  try {
    const img=new Image();
    await new Promise((resolve,reject)=>{ img.onload=resolve; img.onerror=reject; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
    const canvas=document.createElement('canvas');
    canvas.width=1280; canvas.height=800;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,1280,800);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob) throw new Error('empty');
    const file=new File([blob],'noctis-identity-card.png',{type:'image/png'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file],title:'NOCTIS · 身份卡'});
      return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='noctis-identity-card.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  } catch {
    const blob=new Blob([svg],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='noctis-identity-card.svg';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }
  notify(t('身份卡已保存','Đã lưu thẻ danh tính'));
}

/* 学语页：每日一句（14 个日常关键词，按一年中的第几天轮换） */
const LEARN_KEYWORDS=['xin chào','ăn cơm','cảm ơn','tạm biệt','hẹn gặp lại','chúc ngủ ngon','bạn khỏe không','đi đâu','bao nhiêu tiền','ngon quá','xin lỗi','rất vui được gặp bạn','tôi yêu bạn','chúc mừng sinh nhật'];
/* 本地 fallback：中继取不到时也绝不空白、绝不报错 */
const LEARN_DAILY_FALLBACK={vie:'Xin chào, rất vui được gặp bạn',cmn:'你好，很高兴认识你',audio:null};
function learnDayOfYear(now=new Date()) {
  const start=new Date(now.getFullYear(),0,0);
  return Math.floor((now-start)/86400000);
}
async function ensureDailySentence() {
  const day=learnDayOfYear();
  if(state.learn.daily?.day===day || state.learn.dailyLoading) return;
  state.learn.dailyLoading=true;
  const keyword=LEARN_KEYWORDS[day % LEARN_KEYWORDS.length];
  try {
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),10000);
    try {
      const resp=await fetch(BACKEND_TRANSLATE_API+'tatoeba?q='+encodeURIComponent(keyword),{signal:ctrl.signal});
      const data=await resp.json().catch(()=>({}));
      if(data?.ok && data.vie && data.cmn) state.learn.daily={vie:data.vie,cmn:data.cmn,audio:typeof data.audio==='string'?data.audio:null,day};
      else state.learn.daily={...LEARN_DAILY_FALLBACK,day};
    } finally { clearTimeout(timer); }
  } catch {
    state.learn.daily={...LEARN_DAILY_FALLBACK,day};
  }
  state.learn.dailyLoading=false;
  if(state.tab==='learn') render({preserve:true});
}
function speakDailySentence() {
  const d=state.learn.daily;
  if(!d) return;
  if(d.audio) {
    try {
      const audio=new Audio(d.audio);
      audio.play().catch(()=>speakTranslation(d.vie,'vi'));
      return;
    } catch {}
  }
  speakTranslation(d.vie,'vi');
}
async function lookupDict(word) {
  const q=(word||'').trim();
  if(!q) return;
  state.learn.dictQuery=q;
  state.learn.dictLoading=true;
  state.learn.dict=null;
  render({preserve:true});
  try {
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),10000);
    try {
      const resp=await fetch(BACKEND_TRANSLATE_API+'dict?word='+encodeURIComponent(q),{signal:ctrl.signal});
      const data=await resp.json().catch(()=>({}));
      if(!data?.ok) { state.learn.dict={notFound:true,word:q}; }
      else {
        const translations=Array.isArray(data.translations)?data.translations:[];
        const defs=Array.isArray(data.definitions)?data.definitions:[];
        const examples=(Array.isArray(data.examples)?data.examples:[]).filter(x=>typeof x==='string'&&x.trim()).slice(0,3);
        const ipa=data.ipa||{};
        state.learn.dict={word:data.word||q,zh:translations.find(x=>x?.lang==='zh')?.text||'',viDef:defs.find(x=>x?.lang==='vi')?.text||'',enDef:defs.find(x=>x?.lang==='en')?.text||'',examples,ipaHn:ipa.ha_noi||'',ipaSg:ipa.sai_gon||'',audio:typeof data.audio==='string'?data.audio:null};
      }
    } finally { clearTimeout(timer); }
  } catch {
    state.learn.dict={notFound:true,word:q};
  }
  state.learn.dictLoading=false;
  if(state.tab==='learn') render({preserve:true});
}
async function practiceTranslate() {
  const text=(state.learn.practiceInput||'').trim();
  if(!text || state.learn.practiceLoading) return;
  state.learn.practiceLoading=true;
  state.learn.practice=null;
  render({preserve:true});
  const t0=performance.now();
  try {
    const trans=await requestRelayTranslation({sourceText:text,toLang:'vi'});
    const ms=Math.round(performance.now()-t0);
    state.lastTranslateMs=ms;
    state.learn.practice={src:text,trans,ms};

    state.learn.practice={src:text,error:true};
  }
  state.learn.practiceLoading=false;
  if(state.tab==='learn') render({preserve:true});
}

function tutorPlayAudio(base64,sessionId){
  try{
    const Ctx=platform.AudioContext||platform.webkitAudioContext;
    if(!Ctx) return;
    if(!tutor.playCtx) tutor.playCtx=new Ctx();
    const ctx=tutor.playCtx;
    void ctx.resume?.().catch(()=>{});
    const bin=atob(base64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(bytes.length<2) return;
    const samples=new Int16Array(bytes.buffer);
    const buf=ctx.createBuffer(1,samples.length,24000);
    const ch=buf.getChannelData(0);
    for(let i=0;i<samples.length;i++) ch[i]=samples[i]/32768;
    const src=ctx.createBufferSource();
    src.buffer=buf;
    src.connect(ctx.destination);
    tutor.playPending++;
    tutorSetStatus('speaking');
    src.onended=()=>{
      tutor.playPending=Math.max(0,tutor.playPending-1);
      if(tutor.playPending===0 && tutor.sessionId===sessionId && tutorState().status==='speaking') tutorSetStatus('listening');
    };
    src.start();
  }catch{}

function tutorOnRelay(msg,sessionId){
  const T=tutorState();
  if(!msg || typeof msg!=='object') return;
  if(msg.type==='transcript'){

    if(!text) return;
    if(msg.role==='user'){
      T.userText=text; T.userFinal=msg.final===true;
      updateTutorView();
    }else if(msg.role==='tutor'){
      T.tutorText=text; T.tutorFinal=msg.final===true;
      updateTutorView();
      if(msg.final===true){
        const expect=text;
        void requestRelayTranslation({sourceText:text,toLang:'zh'}).then(zh=>{
          if(tutor.sessionId!==sessionId || tutorState().tutorText!==expect) return;
          T.tutorZh=zh;
          updateTutorView();
        }).catch(()=>{});
      }
    }
    return;
  }
  if(msg.type==='audio' && typeof msg.data==='string' && msg.data){
    tutorPlayAudio(msg.data,sessionId);
    return;
  }
  if(msg.type==='error'){
    const raw=typeof msg.message==='string'?msg.message:'';
    tutorTeardown();
    T.notice=/402|额度|credit/i.test(raw)
      ?t('额度已用完，请稍后再试','Đã hết lượt, hãy thử lại sau')

      const input=event.inputBuffer.getChannelData(0);
      const outLen=Math.floor(input.length/ratio);
      const pcm=new Int16Array(outLen);
      for(let i=0;i<outLen;i++){
        const s=input[Math.min(input.length-1,Math.floor(i*ratio))];
        pcm[i]=Math.max(-32768,Math.min(32767,Math.round(s*32768)));
      }
      const bytes=new Uint8Array(pcm.buffer);
      const merged=new Uint8Array(tutor.pcmTail.length+bytes.length);
      merged.set(tutor.pcmTail); merged.set(bytes,tutor.pcmTail.length);
      let off=0;
      while(merged.length-off>=TUTOR_FRAME_BYTES){
        try{ tutor.ws.send(merged.slice(off,off+TUTOR_FRAME_BYTES).buffer); }catch{ return; }
        off+=TUTOR_FRAME_BYTES;
      }
      tutor.pcmTail=merged.slice(off);
    };
    source.connect(processor);
    processor.connect(ctx.destination);
  }catch{
    tutorTeardown();
    tutorState().notice=t('麦克风打不开，请检查后重试','Không mở được micrô, hãy kiểm tra rồi thử lại');
    tutorSetStatus('error');
  }
}
async function startTutor(){
  const T=tutorState();
  if(T.status==='connecting'||T.status==='listening'||T.status==='speaking') return;
  if(!platform.navigator?.mediaDevices?.getUserMedia || typeof platform.WebSocket!=='function'){
    T.notice=t('当前设备不支持麦克风，请用手机浏览器打开','Thiết bị này không hỗ trợ micrô, hãy mở bằng trình duyệt trên điện thoại');
    tutorSetStatus('error'); return;
  }
  T.userText=''; T.userFinal=false; T.tutorText=''; T.tutorFinal=false; T.tutorZh=''; T.notice=''; T.elapsed=0; T.lastSeconds=0;
  tutorSetStatus('connecting');
  let stream;
  try{
    stream=await platform.navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(err){
    T.notice=err?.name==='NotAllowedError'||err?.name==='SecurityError'
      ?t('麦克风权限被拒绝，允许后重试','Quyền micrô đã bị từ chối, hãy cho phép rồi thử lại')
      :t('麦克风打不开，请检查后重试','Không mở được micrô, hãy kiểm tra rồi thử lại');
    tutorSetStatus('error'); return;
  }
  tutor.sessionId++;
  const sessionId=tutor.sessionId;
  tutor.stopping=false;
  tutor.stream=stream;
  let ws;
  try{ ws=new platform.WebSocket(TUTOR_REALTIME_URL); }catch{
    tutorStopMic();
    T.notice=t('连不上口语陪练，请检查网络后重试','Không kết nối được, hãy kiểm tra mạng rồi thử lại');
    tutorSetStatus('error'); return;
  }
  tutor.ws=ws;
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{
    if(tutor.sessionId!==sessionId) return;
    try{ ws.send(JSON.stringify({type:'start'})); }catch{}
    tutorStartAudio(stream,sessionId);
    if(tutorState().status!=='connecting') return;
    tutor.startedAt=Date.now();
    T.elapsed=0;
    tutor.timerId=setInterval(()=>{
      if(tutor.sessionId!==sessionId) return;
      T.elapsed=Math.floor((Date.now()-tutor.startedAt)/1000);
      const time=document.querySelector('[data-tutor-time]');
      if(time) time.textContent=elapsedLabel(T.elapsed);
    },1000);
    tutorSetStatus('listening');
  };
  ws.onmessage=event=>{
    if(tutor.sessionId!==sessionId) return;
    if(typeof event.data!=='string') return;
    let msg;
    try{ msg=JSON.parse(event.data); }catch{ return; }
    tutorOnRelay(msg,sessionId);
  };
  ws.onerror=()=>{};
  ws.onclose=()=>{
    if(tutor.sessionId!==sessionId || tutor.stopping) return;
    tutorStopMic();
    clearInterval(tutor.timerId); tutor.timerId=null;
    if(T.status==='connecting') T.notice=t('连不上口语陪练，请检查网络后重试','Không kết nối được, hãy kiểm tra mạng rồi thử lại');
    else if(T.status==='listening'||T.status==='speaking') T.notice=t('连接已断开，请重新开始','Đã mất kết nối, hãy bắt đầu lại');
    tutorSetStatus('error');
  };
}
function toggleTutor(){
  const s=tutorState().status;
  if(s==='connecting'||s==='listening'||s==='speaking') stopTutor();
  else void startTutor();
}

function speakTranslation(text, lang) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const targetPrefix = lang === 'vi' ? 'vi' : 'zh';
  // 遍历系统可用声音
  const voices = window.speechSynthesis.getVoices();
  const match = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(targetPrefix));
  if (match) u.voice = match;
  u.lang = lang === 'vi' ? 'vi-VN' : 'zh-CN';
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

}

function updateCall() {
  const call=state.call;
  if (!call) return;
  const elapsed=Math.floor((Date.now()-call.start)/1000);
  document.querySelector('#call-time').textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;
  if(call.rtcMode) {renderRtcCaptions(call);return;}
  let count=1+Math.floor(elapsed/4);
  if(call.kind==='voice') {
    if(!call.noise && !call.holding && call.mic && elapsed>=call.nextTurn) {
      call.voiceCount++;
      call.voiceTimes.push(elapsed);
      call.nextTurn=elapsed+4;
    }
    count=call.voiceCount;
    const [lang]=lines[(count-1)%lines.length];
    const turn=document.querySelector('#voice-language');
    if(turn) {
      const speaker=lang==='zh'?t('你','Bạn'):label(find(call.person));
      const status=call.holding?t('正在按住说话','Đang giữ để nói'):`${speaker} · ${t('识别','Nhận diện')} ${languageName(lang)}`;
      if(turn.textContent!==status) turn.textContent=status;
    }
  }

  const follow=call.resumeFollow || (!call.followPaused && (rendered ? captionsAtBottom(area) : call.captionPosition?.follow ?? true));

  const markup=Array.from({length:count-rendered},(_,index)=>{

/* ---------- 聊天滚动：微信 / Telegram 式跟随与锚点 ---------- */
/* 唯一滚动入口：只有新消息到达、且用户正在底部附近（80px 内）时才跟随到底部；
   翻译状态、消息状态、组件重渲染一律不强制滚动，改用滚动锚点保持阅读位置。 */
const CHAT_FOLLOW_PX = 80;
let chatFollowing = true;
let chatUnreadBelow = 0;
function isTimelineNearBottom(el, px = CHAT_FOLLOW_PX) { return !el || (el.scrollHeight - el.scrollTop - el.clientHeight <= px); }
function timelineAnchor(el) {
  if (!el) return null;

  for (const row of el.querySelectorAll('[data-mid]')) {
    const r = row.getBoundingClientRect();
    if (r.bottom > top + 1) return { mid: row.dataset.mid, gap: r.top - top, scrollHeight: el.scrollHeight, scrollTop: el.scrollTop, conversation };
  }
  return { mid: null, gap: 0, scrollHeight: el.scrollHeight, scrollTop: el.scrollTop, conversation };
}

  if (!el) return;

    if (row) { el.scrollTop = Math.max(0, el.scrollTop + (row.getBoundingClientRect().top - el.getBoundingClientRect().top) - anchor.gap); return; }
  }
  if (anchor) el.scrollTop = Math.max(0, anchor.scrollTop + (el.scrollHeight - anchor.scrollHeight));
  else if (typeof fallbackTop === 'number') el.scrollTop = fallbackTop;
}

  const show = el.scrollHeight - el.scrollTop - el.clientHeight > CHAT_FOLLOW_PX;
  wrap.classList.toggle('visible', show);

/* iOS 键盘收起回落：点输入框弹键盘时页面会上移，收键盘后 Safari 不把
   滚动位置还回来，输入框就“卡在上面下不来”，下面留一大片黑。
   输入框失焦、或可视区域高度恢复（键盘收了）时，把页面滚回顶部、
   把时间线滚到底部，输入框就落回原位。120ms 等键盘动画收完再滚，

      save('messages',state.sent);
      state.tab='messages'; state.active=person; state.mobileChat=true; state.scrollLatest=true; state.details=false;
    }
    render({preserve:d.transcriptAction==='cancel'});
  }
});
function holdVoice(control, held, commit=false) {
  const call=state.call;
  if(!call || call.kind!=='voice' || (!call.mic && held) || call.holding===held) return;
  call.holding=held;
  control.setAttribute('aria-pressed',String(held));
  if(!held && commit && call.mic) {
    call.voiceCount++;
    const elapsed=Math.floor((Date.now()-call.start)/1000);
    call.voiceTimes.push(elapsed);
    call.nextTurn=elapsed+4;
  }
  updateCall();
}
root.addEventListener('pointerdown',event=>{
  const control=event.target.closest('[data-hold-talk]');
  if(!control || event.button!==0) return;
  control.setPointerCapture(event.pointerId);
  holdVoice(control,true);
});
for(const type of ['pointerup','pointercancel','lostpointercapture']) root.addEventListener(type,event=>{
  const control=event.target.closest('[data-hold-talk]');
  if(control) holdVoice(control,false,type==='pointerup');
});
/* 学语页：点每日一句大卡翻面、点练一句结果读出来（卡片本身不是按钮） */
root.addEventListener('click',event=>{
  if(event.target.closest('button')) return;
  const daily=event.target.closest('[data-learn-daily-flip]');
  if(daily) { state.learn.dailyFlipped=!state.learn.dailyFlipped; render({preserve:true}); return; }
  const practice=event.target.closest('[data-learn-practice-speak]');
  if(practice && state.learn.practice?.trans) speakTranslation(state.learn.practice.trans,'vi');
});
/* 金句收藏：长按学语页情景短语 500ms 存为金句（长按后那一下点按不读出来） */
let learnLongTimer=null;
let learnLongPressed=false;
let learnLongTarget=null;
let learnLongStart=null;
function clearLearnLongTimer() {
  if(learnLongTimer) { clearTimeout(learnLongTimer); learnLongTimer=null; }
  learnLongTarget=null;
  learnLongStart=null;
}
root.addEventListener('pointerdown',event=>{
  if(event.target.closest('button') && !event.target.closest('.learn-phrase')) return;
  const row=event.target.closest('.learn-phrase');
  if(!row || row.dataset.learnPhrase===undefined) return;
  const [packId,idx]=row.dataset.learnPhrase.split(':');
  const pack=PACKS.find(c=>c.id===packId);
  const item=pack?.items[Number(idx)];
  if(!item) return;
  learnLongPressed=false;
  learnLongTarget={packId,idx:Number(idx)};
  learnLongStart={x:event.clientX,y:event.clientY};
  learnLongTimer=setTimeout(()=>{
    learnLongTimer=null;
    const p=PACKS.find(c=>c.id===learnLongTarget.packId);
    const it=p?.items[learnLongTarget.idx];
    if(!it) return;
    if(state.savedPhrases.some(p=>p.src===it.vi&&p.trans===it.zh)) { notify(t('已经收藏过了','Đã lưu rồi')); return; }
    state.savedPhrases.unshift({src:it.vi,trans:it.zh,side:'peer',ts:Date.now()});
    state.savedPhrases=state.savedPhrases.slice(0,50);
    save('saved-phrases',state.savedPhrases);
    learnLongPressed=true;
    try { if(navigator.vibrate) navigator.vibrate(20); } catch {}
    notify(t('已收藏金句','Đã lưu câu hay'));
  },500);
});
for(const type of ['pointerup','pointercancel','lostpointercapture']) root.addEventListener(type,clearLearnLongTimer);
root.addEventListener('pointermove',event=>{
  if(!learnLongTimer || !learnLongStart) return;
  const dx=event.clientX-learnLongStart.x, dy=event.clientY-learnLongStart.y;
  if(dx*dx+dy*dy>100) clearLearnLongTimer();
});
root.addEventListener('keydown',event=>{
  if(event.code!=='Space' || !event.target.matches('[data-hold-talk]')) return;
  event.preventDefault();
  if(!event.repeat) holdVoice(event.target,true);
});
root.addEventListener('keyup',event=>{
  if(event.code!=='Space' || !event.target.matches('[data-hold-talk]')) return;
  event.preventDefault();
  holdVoice(event.target,false,true);
});
/* 学语页：输入框回车查词 / 翻译；输入内容先记进 state，刷新不丢 */
root.addEventListener('input',event=>{
  if(event.target.matches('[data-learn-dict-input]')) state.learn.dictQuery=event.target.value;
  if(event.target.matches('[data-learn-practice-input]')) state.learn.practiceInput=event.target.value;
});
root.addEventListener('keydown',event=>{
  if(event.key==='Enter' && event.target.matches('[data-learn-daily-flip]')) {
    state.learn.dailyFlipped=!state.learn.dailyFlipped; render({preserve:true}); return;
  }
  if(event.key!=='Enter') return;
  if(event.target.matches('[data-learn-dict-input]')) { void lookupDict(event.target.value); return; }
  if(event.target.matches('[data-learn-practice-input]')) { state.learn.practiceInput=event.target.value; void practiceTranslate(); }
});
root.addEventListener('change', event=>{
  const {contextKey,contextChat}=event.target.dataset;
  if(contextKey && contextChat===state.active) {
    const value=event.target.value;
    const valid=contextKey==='style'?['dating','daily'].includes(value):
      ['myRole','peerRole'].includes(contextKey)&&['anh','em','ban'].includes(value);
    if(valid) {
      state.conversationContexts[contextChat]={...conversationContext(contextChat),[contextKey]:value};
      save('conversation-contexts',state.conversationContexts);
    }
    return;
  }
  if('groupViewer' in event.target.dataset) {
    state.groupViewer[state.active]=event.target.value;
    render({preserve:true});
    return;
  }
  const member=event.target.dataset.memberLanguage;
  if(!member) return;
  (state.groupLanguages[state.active] ||= {})[member]=event.target.value;
  save('group-languages',state.groupLanguages);
  render({preserve:true});
});
root.addEventListener('input', event => {
  if(event.target.id==='search') { state.search=event.target.value; document.querySelector('.threads').innerHTML=listRows(); }
});
root.addEventListener('submit', event => {
  event.preventDefault();
  if(event.target.id==='friend-search') {
    state.friendQuery=event.target.elements.query.value;
    render({preserve:true});
  }
  if(event.target.id==='message-form') {
    const input=event.target.elements.message;
    const message=input.value.trim();
    if(!message) return;
    const match=phrases.find(pair=>pair.some(phrase=>phrase.toLowerCase()===message.replace(/[。！!?！.]+$/u,'').toLowerCase()));
    const lang=/\p{Script=Han}/u.test(message)?'zh':(match?'vi':state.lang);
    input.value='';
    const payload=translationPayload(find(state.active),message,lang);
    const key=JSON.stringify(payload.context);
    const cached=state.translationCache.find(row=>row[0]===lang&&row[1]===message&&row[3]===key);
    queueDemoMessage(message,lang,cached?.[2]||demoTranslation(payload),false,payload);
    if(state.active==='assistant') askAssistant(find(state.active),message,lang);
  }
});
function installManifest() {
  if(!document.head || !/^https?:$/.test(platform.location?.protocol || '')) return;
  const start=new URL(platform.location.href);
  start.hash='';
  const scope=new URL('./',start);
  const icon='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0B0A08"/><path d="M122 170h268v150H240l-75 58v-58h-43z" fill="none" stroke="#D8B56D" stroke-width="18" stroke-linejoin="round"/><path d="M184 224h144m-144 43h104" stroke="#D8B56D" stroke-width="16" stroke-linecap="round"/></svg>';
  const manifest={
    id:start.pathname,name:brandName,short_name:'夜语',start_url:start.href,scope:scope.href,
    display:'standalone',orientation:'portrait',background_color:'#0B0A08',theme_color:'#0B0A08',
    icons:[{src:'data:image/svg+xml,'+encodeURIComponent(icon),sizes:'any',type:'image/svg+xml',purpose:'any'}]
  };
  const link=document.createElement('link');
  link.rel='manifest';link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
  document.head.append(link);
  const touchIcon=document.createElement('link');
  touchIcon.rel='apple-touch-icon';touchIcon.href=manifest.icons[0].src;
  document.head.append(touchIcon);
}
installManifest();
function keepComposerVisible() {
  const input=document.activeElement;
  if(!input?.matches?.('#message-form input')) {
    document.documentElement.style?.removeProperty('--chat-viewport-height');
    return;
  }
  const viewport=globalThis.visualViewport;
  if(viewport && matchMedia('(max-width: 768px), (max-width: 950px) and (pointer: coarse)').matches) {
    const height=Math.round(viewport.height+viewport.offsetTop);
    const composer=input.closest('.composer');
    const timeline=document.querySelector('.timeline');
    const follow=!!timeline && isTimelineNearBottom(timeline);
    document.documentElement.style?.setProperty('--chat-viewport-height',`${height}px`);
    const align=()=>{
      if(document.activeElement!==input) return;
      if(composer && composer.getBoundingClientRect().bottom>height+1) composer.scrollIntoView({block:'nearest',behavior:'auto'});
      if(follow && timeline) timeline.scrollTop=timeline.scrollHeight;
    };
    if(typeof platform.requestAnimationFrame==='function') platform.requestAnimationFrame(align); else align();
  }
}
root.addEventListener('focusin',event=>{
  if(event.target.matches?.('#message-form input')) keepComposerVisible();
});
root.addEventListener('focusout',event=>{
  if(event.target.matches?.('#message-form input')) queueMicrotask(keepComposerVisible);
});
// 个人资料行内改：输入框/下拉框一改完（失焦或选好）就自动保存、退出编辑。
root.addEventListener('change',event=>{
  if(event.target?.id?.startsWith('inline-profile-')) { saveInlineProfileField(); render(); }
});
// 行内输入框里按回车 = 改完，收起键盘触发保存。
root.addEventListener('keydown',event=>{
  if(event.key==='Enter' && event.target?.id?.startsWith('inline-profile-') && event.target.tagName==='INPUT') event.target.blur();
});
globalThis.visualViewport?.addEventListener('resize',keepComposerVisible);
globalThis.visualViewport?.addEventListener('scroll',keepComposerVisible);
voiceEngine?.addEventListener?.('voiceschanged',refreshLocalVoices);
refreshLocalVoices();
render();
