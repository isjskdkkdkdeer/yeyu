<style>

* {box-sizing:border-box}

.profile-field-link {width:100%;text-align:start;color:var(--strong)}
.profile-field-link:hover {background:var(--soft)}

/* Shared control states */
button,a.social-button { -webkit-tap-highlight-color:transparent }
button:not(:disabled):active,a.social-button:active { filter:brightness(.91) }
button:disabled { cursor:default }
button[aria-expanded=true].icon-button { background:var(--choice);color:var(--strong) }
.icon-button {width:44px;height:44px;border-radius:var(--radius-control)}
.add {background:var(--choice)}
.primary,.send {border-radius:var(--radius-control);min-height:44px}
.text-button,.social-button,.social-actions button {min-height:44px;border-radius:var(--radius-control)}
.social-actions button[aria-pressed=true] {background:var(--choice);border-color:var(--accent);color:var(--strong)}
.text-button[aria-pressed=true] {background:var(--soft)}
.nav button.selected svg {background:var(--choice);box-shadow:0 0 0 5px var(--choice);border-radius:5px}
.nav button.selected {background:none}
.nav button {gap:8px;font-size:var(--text-xs)}
.nav button:hover {background:var(--soft)}

/* Conversation and account surfaces */
.search {height:46px;border-radius:var(--radius-control)}
.filters button {font-size:var(--text-sm);min-height:40px;border-radius:var(--radius-pill)}
.brand-icon {box-shadow:var(--shadow-card)}
.chat-title strong {font-size:var(--text-md)}
.chat-title small,.chat-notice,.section-notice {font-size:var(--text-xs);line-height:1.5}
.chat-notice,.section-notice {background:var(--soft);color:var(--muted)}
.bubble {box-shadow:var(--shadow-card)}
.translation span {min-width:0}
.section-content {padding-inline:var(--space-4)}
.person-row,.profile-card,.post-author {padding:var(--space-4)}
.person-row>div,.profile-identity>div {min-width:0;overflow-wrap:anywhere}
.settings-card {padding:var(--space-4)}
.settings-card h2 {font-size:var(--text-md);line-height:1.4}
.profile-fields>div,.profile-field-link {min-height:54px;gap:var(--space-4)}
.profile-fields dt {font-weight:600}
.profile-field-link {font-weight:700}
.profile-summary .icon-button {background:var(--soft)}
.qr-card {gap:var(--space-3);padding-block:var(--space-3)}
.qr-card img {border:1px solid var(--line);border-radius:var(--radius-control)}
.theme-option {min-height:55px;padding:var(--space-3);border-radius:var(--radius-control);background:var(--side)}
.theme-option .swatch {box-shadow:0 0 0 1px var(--line)}
.theme-option:hover {background:var(--soft)}
.language-buttons button {min-height:44px}
.feed-switch {padding:var(--space-1);background:var(--soft);border:1px solid var(--line);border-radius:var(--radius-card)}
.feed-switch button {background:transparent;border-color:transparent}
.post-actions {padding-inline:var(--space-3);border-top:1px solid var(--line);margin-top:var(--space-2)}
.post-actions button {min-height:38px}

/* Captions stay above the call controls in a single scrolling region. */
.call-screen {--call-bottom:max(16px,env(safe-area-inset-bottom));--controls-offset:90px}
.video-live::before {background:linear-gradient(#08130fd9 0%,#08130f08 30%,#08130f18 43%,#08130fbc 69%,#08130fe8 100%)}
.call-identity {min-width:0;flex:0 1 auto}
.call-badge {flex:0 1 auto;text-align:start;background:#101d19bd}
.captions,.captions-off {bottom:calc(var(--call-bottom) + var(--controls-offset))}
.caption-head h2 {font-size:var(--text-xs);color:#e3eee9;margin-bottom:var(--space-2)}
.caption-pair>p:nth-child(2) {color:#e1f2e8}
.call-controls {bottom:var(--call-bottom);margin-inline:auto;width:max-content;max-width:calc(100% - 16px);gap:clamp(3px,2vw,22px);padding:8px 9px;background:#0b1715c9;border:1px solid #ffffff31;border-radius:24px}
.call-controls>div {min-width:0;gap:3px;flex:1;min-inline-size:50px}
.call-controls span {white-space:nowrap;font-size:var(--text-xs)}
.call-control {width:clamp(44px,12vw,54px);background:#35443d;border-color:#ffffff60}
.call-control:hover {border-color:white}
.call-control.hang-up {background:#bd2d46}
@media (max-width:768px), (max-width:950px) and (pointer:coarse) {
 .brand {padding-inline:var(--space-4)}
 .list-heading {margin-block:4px 12px}
 .thread-copy strong {font-size:var(--text-base)}
 .thread-copy small {font-size:var(--text-sm)}
 .composer-note span:last-child {display:none}
 .head-actions .icon-button {width:44px}

}

}

.demo-mark {display:inline-block;vertical-align:middle;padding:2px 7px;border-radius:var(--radius-pill);background:var(--soft);color:var(--strong);font-size:var(--text-xs);font-weight:650;line-height:1.45;text-decoration:none;white-space:nowrap}
.call-badge {background:none;border:0;padding:0}

.person-row>.icon-button {flex-shrink:0}

.message-status button,.message-translate,.voice-actions button,.composer-tools button {display:inline-flex;align-items:center;gap:5px;color:var(--strong);font-size:var(--text-sm);font-weight:650;padding:4px 5px;min-height:32px;border-radius:7px}
.message-translate:hover,.voice-actions button:hover,.composer-tools button:hover,.composer-tools [aria-pressed=true] {background:var(--choice)}
.message-translate svg,.voice-actions svg,.composer-tools svg {width:16px;height:16px}
.translation {align-items:center;justify-content:space-between}
.voice-actions,.composer-tools {display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.composer-tools {justify-content:space-between;margin-top:4px}
.composer-note {display:none}
.group-languages {display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px;padding:10px;border-radius:var(--radius-control);background:var(--soft)}
.group-languages label {display:flex;align-items:center;gap:5px;font-size:var(--text-xs)}
.group-languages select {font:inherit;min-height:30px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.group-languages small {flex-basis:100%;font-size:var(--text-xs)}
.nearby-location {padding:0 0 12px}
.caption-tools {display:flex;justify-content:flex-end;gap:7px;margin-bottom:6px}
.call-tool {min-height:32px;border:1px solid #ffffff66;border-radius:10px;background:#11221edb;color:#fff;padding:4px 9px;font-size:var(--text-xs)}
.call-tool[aria-pressed=true] {background:#dff3e6;color:#15392c}
.call-tool:focus-visible {outline-color:#fff}
.caption-scroll[data-caption-size="1"] p {font-size:clamp(21px,3.2vw,35px)}
.caption-scroll[data-caption-size="2"] p {font-size:clamp(24px,3.6vw,39px)}
.voice-turn {position:absolute;top:43%;left:12px;right:12px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.voice-turn strong,.voice-turn small {flex-basis:100%;text-align:center;color:#e1f2e8;font-size:var(--text-xs)}
.voice-turn [data-hold-talk] {touch-action:none;user-select:none}
@media (max-height:460px) {
 .voice-turn {top:50px}
 .voice-turn+.captions .caption-scroll {height:55px}
}

/* Keep primary chat actions close to the bottom edge. */
.filters {gap:8px;padding-inline:16px}
.filters button {min-height:44px}
.thread-meta b {background:var(--warm);color:#352419}
.composer {padding-top:8px}
.composer form {border-color:var(--line);border-radius:var(--radius-control)}
.composer:focus-within form {border-color:var(--accent)}
.composer-tools {gap:8px;margin-top:4px}
.composer-tools button {min-height:44px;padding-inline:8px}
.composer-tools [data-send-voice] {background:var(--soft)}
.composer-tools [data-offline]:not([aria-pressed=true]) {color:var(--muted)}
.composer-tools [data-offline][aria-pressed=true] {outline:1px solid var(--accent);outline-offset:-1px}
.message-translate,.voice-actions button,.message-status button {min-height:44px}
.message-translate[data-message-open=false] {color:var(--muted)}
.message-status [data-retry-send],.translation [data-retry-translation] {text-decoration:underline;text-underline-offset:3px}

.call-tool {min-height:44px}

@media (max-width:768px), (max-width:950px) and (pointer:coarse) {
 .threads {padding-inline:8px}
 .thread {min-height:64px;padding-inline:8px}
 .composer {padding-inline:8px}
 .nav {padding-inline:8px}
 .profile-summary {margin-bottom:16px}
}

/* Personal settings use flat rows and a neutral surface on every theme. */
.profile-settings-shell {
  --settings-surface:var(--outer);
  --settings-ink:var(--ink);
  --settings-muted:var(--muted);
  --settings-line:var(--line);
  --settings-pressed:var(--soft);
}
.profile-settings-shell .section-page,
.profile-settings-shell .section-header,
.profile-settings-shell .nav {
  background:var(--settings-surface);
  color:var(--settings-ink);
  border-color:var(--settings-line);
}
.profile-settings-shell .section-header {gap:8px;padding-inline:16px}
.profile-settings-shell .section-header h1 {color:inherit;font-size:1.375rem;font-weight:700}

.profile-settings-shell .settings-item {padding:12px 0 8px;border-top:1px solid var(--settings-line)}
.profile-settings-shell .settings-item h2 {margin:0 0 4px;font-size:1.125rem;line-height:1.5;font-weight:700}
.settings-choice {display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px 0;color:inherit;text-align:start;font-size:1rem;font-weight:400;line-height:1.5}
.settings-choice svg {width:18px;height:18px;margin-inline-start:auto;color:var(--accent)}
.settings-swatch {width:12px;height:12px;flex:none;border-radius:50%;background:#226a53}
.settings-swatch.ocean {background:#205d9c}
.settings-swatch.plum {background:#6f3991}
.settings-swatch.peach {background:#9f422b}
.profile-settings-shell .settings-choice:active,
.profile-settings-shell .profile-summary button:active {background:var(--settings-pressed);filter:none}

.profile-settings-shell .nav button.selected {color:var(--accent)}

/* A flat index below the profile preserves the existing settings controls. */
.settings-list {border-top:1px solid var(--settings-line)}
.setting-row {
  display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;align-items:center;
  gap:8px;width:100%;min-height:48px;padding:6px 0;border-bottom:1px solid var(--settings-line);
  color:inherit;text-align:start;text-decoration:none;font-size:var(--text-base);line-height:1.45;
}
.setting-row>small {color:var(--settings-muted);font-size:.8125rem;text-align:end}
.setting-row small,.setting-row>span {overflow-wrap:break-word}
.setting-row svg {display:block;width:20px;height:20px;color:var(--settings-muted)}
.setting-row>svg {width:16px;height:16px}
button.setting-row:active,a.setting-row:active {background:var(--settings-pressed);filter:none}
.settings-list+.settings-item {border-top:0}
#language-heading {scroll-margin-top:86px}
.profile-settings-shell .profile-identity small {white-space:nowrap}

/* Keep the translation control and delivery information on the same line. */
.message {margin-bottom:6px}
.bubble {padding:6px 9px;line-height:1.45}
.message-original,.translation>span {white-space:pre-wrap}
.translation {margin-top:4px;padding-top:4px;font-size:var(--text-sm);line-height:1.45}
.message-footer {display:flex;flex-wrap:wrap;align-items:center;gap:0 8px}
.message-footer>.message-translate {padding:0 4px;gap:4px;font-size:var(--text-xs);min-width:44px}
.message-footer .message-status {padding-top:0;min-height:24px}
.own .message-footer {justify-content:flex-end}
@media (max-width:768px), (max-width:950px) and (pointer:coarse) {
 .timeline {padding-block:6px 8px}

 .message-shell.mobile-open .chat-panel {flex:1 1 0}

.profile-menu-group .setting-row>small {white-space:nowrap}

@media (max-width:768px), (max-width:950px) and (pointer:coarse) {
 .profile-settings-shell .section-content {padding-inline:20px}

/* Clean-47 surfaces and rows */

function demoTranslation(payload) {
  const {text,sourceLanguage,context}=payload;
  const normalized=text.replace(/[。！？!?.]+$/u,'').trim();
  if(sourceLanguage==='zh' && ['你在哪里','你现在在哪里','你在哪儿'].includes(normalized)) {
    const peer=roleText[context.peerRole] || 'Em';
    return `${peer} đang ở đâu${context.style==='dating'?' đấy':''}?`;
  }
  if(sourceLanguage==='zh' && ['我想你','我想你了'].includes(normalized)) {
    const speaker=roleText[context.myRole] || 'Anh';
    return `${speaker} nhớ ${(roleText[context.peerRole] || 'Em').toLowerCase()}${context.style==='dating'?' quá':''}.`;
  }
  const match=phrases.find(pair=>pair[sourceLanguage==='zh'?0:1].toLowerCase()===normalized.toLowerCase());
  return match?.[sourceLanguage==='zh'?1:0] || '';
}

function messageRow(person,[lang,original,translation,time,sender,meta],index) {

  const author=chats.find(item=>item.name===sender) || person;
  const key=person.id+':'+index;
  const viewer=state.groupViewer[person.id] || demoProfile.id;
  const preferred=state.groupLanguages[person.id]?.[viewer] || (viewer===demoProfile.id?state.lang:'vi');
  const translating=pendingReplyTranslations.has(meta) || liveTranslations.has(meta);
  const expanded=state.translated[person.id]!==false && (state.expanded[key] ?? (!meta?.voice && (meta?.demoReply || !person.group || preferred!==lang)));
  const status=meta?.status==='sending'&&!pendingMessages.has(meta)?'failed':meta?.status || (own?'read':'delivered');
  const statuses={sending:t('发送中','Đang gửi'),failed:t('发送失败','Gửi thất bại'),delivered:t('已送达','Đã nhận'),read:t('已读','Đã xem')};
  const localIndex=index-person.messages.length;
  const translated=translation&&!translating&&!state.translationErrors[key];
  const measured=translated&&Number.isFinite(meta?.translationMs)?`<small class="translation-latency">${meta.translationRoute==='local'?`${t('本地','Cục bộ')} · `:''}⚡ ${meta.translationMs}ms</small>`:'';
  const primaryTranslation=(!meta?.demoReply || person.group) && (person.group || !own) && preferred!==lang && translated && state.translated[person.id]!==false;
  const primary=primaryTranslation?translation:original;
  const primaryLang=primaryTranslation?otherLanguage(lang):lang;
  const showDetails=!translating && (state.translated[person.id]!==false && (expanded || meta?.voice)) && !primaryTranslation;
  const canToggle=!translating && state.translated[person.id]!==false && !primaryTranslation && !meta?.voice;
  const originalDetails=primaryTranslation?`<details class="message-original-details" ${meta?.voice?'open':''}><summary>${t('查看原文','Xem nguyên văn')}</summary><div class="message-original" lang="${textLanguage(lang)}">${escape(original)}</div></details>`:'';

  return `<article class="message ${own?'own':''}"><div class="message-side">${!own?avatar(author,'tiny'):''}</div><div class="message-content">
    ${person.group&&!own?`<small class="sender">${label(author)}</small>`:''}

function refreshLocalVoices() {

function playOrStopVoice(control) {
  const {playVoice,voiceTrack,voiceKey}=control.dataset;
  if(activeVoiceTrack && activeVoiceTrack.key===voiceKey) {
    activeVoiceTrack=null;
    voiceTrackResults.set(voiceKey,'stopped');
    voiceEngine.cancel();
    refreshVoiceButtons();
    return;
  }
  const message=messages(find(state.active))[Number(playVoice)];
  if(!message?.[5]?.voice) return;
  const [lang,original,translation]=message;
  const translated=voiceTrack==='translated';
  const spokenLang=translated?otherLanguage(lang):lang;
  const voice=localVoices[spokenLang];
  const text=translated?translation:original;
  if(!voice || !text || (translated && state.translationErrors[state.active+':'+playVoice])) return;

  if(activeVoiceTrack) {
    voiceTrackResults.set(activeVoiceTrack.key,'stopped');
    activeVoiceTrack=null;
    voiceEngine.cancel();
  }
  voiceTrackResults.delete(voiceKey);
  const speech=new SpeechSynthesisUtterance(text);
  speech.voice=voice;
  speech.lang=voice.lang;
  const play={key:voiceKey,started:false};
  activeVoiceTrack=play;
  const finish=failed=>{
    if(activeVoiceTrack!==play) return;
    activeVoiceTrack=null;
    voiceTrackResults.set(voiceKey,failed?'failed':'completed');
    if(!failed) playedVoiceTracks.add(voiceKey);
    refreshVoiceButtons();
  };
  speech.onstart=()=>{
    if(activeVoiceTrack!==play) return;
    play.started=true;
    playedVoiceTracks.add(voiceKey);
    refreshVoiceButtons();
  };
  speech.onend=()=>finish(false);
  speech.onerror=()=>finish(true);
  refreshVoiceButtons();
  try { voiceEngine.speak(speech); }
  catch { finish(true); }
}

const platform=globalThis.window || globalThis;
const nativeRequests=new Map();
let nativeSequence=0;
let cloudTranslationEnabled=false;

function requestNativeTranslation(bridge,payload) {
  return new Promise((resolve,reject)=>{
    const requestId='translate-'+Date.now()+'-'+(++nativeSequence);
    const timer=setTimeout(()=>finish(null,new Error('Native translation timed out')),2200);
    function finish(result,error) {
      if(!nativeRequests.delete(requestId)) return;
      clearTimeout(timer);
      if(error) reject(error); else resolve(result);
    }
    nativeRequests.set(requestId,finish);
    try {
      const reply=bridge.postMessage({...payload,requestId});
      if(reply!==undefined) Promise.resolve(reply).then(result=>finish(result),error=>finish(null,error));
    } catch(error) {finish(null,error);}
  });
}

function translatedText(result) {
  const text=typeof result==='string'?result:result?.translatedText;
  return typeof text==='string'?text.trim():'';
}
async function requestCloudTranslation(payload,onPartial) {
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),8000);
  try {
    const response=await platform.fetch('/api/translate',{
      method:'POST',credentials:'same-origin',signal:controller.signal,
      headers:{'Content-Type':'application/json','Accept':'text/event-stream, application/x-ndjson, application/json'},
      body:JSON.stringify(payload)
    });
    if(!response.ok) throw new Error('Translation API returned '+response.status);
    const type=response.headers.get('content-type') || '';
    if(!response.body?.getReader || !/event-stream|ndjson/i.test(type)) return translatedText(await response.json());
    const reader=response.body.getReader();
    const decoder=new TextDecoder();
    let buffer='',text='',eventLines=[];
    const sse=/event-stream/i.test(type);
    function packet(line) {
      if(!line || line==='[DONE]') return line==='[DONE]';
      const item=JSON.parse(line);
      if(item.error) throw new Error('Streaming translation failed');
      if(typeof item.translatedText==='string') text=item.translatedText;
      else if(typeof item.delta==='string') text+=item.delta;
      if(text.length>16000) throw new Error('Translation response too large');
      if(text) onPartial?.(text);
      return item.isFinal===true;
    }
    function line(value) {
      if(!sse) return packet(value.trim());
      if(value.startsWith('data:')) {eventLines.push(value.slice(5).trimStart());return false;}
      if(value==='' && eventLines.length) {
        const result=packet(eventLines.join('\n'));
        eventLines=[];
        return result;
      }
      return false;
    }
    try {
      while(true) {
        const {value,done}=await reader.read();
        buffer+=decoder.decode(value,{stream:!done});
        if(buffer.length>64000) throw new Error('Translation stream line too large');
        const lines=buffer.split(/\r?\n/);
        buffer=lines.pop() || '';
        for(const part of lines) if(line(part)) return text.trim();
        if(done) {
          if(buffer) line(buffer);
          if(sse) line('');
          return text.trim();
        }
      }
    } finally {void reader.cancel().catch(()=>{});}
  } finally {clearTimeout(timer);}
}

async function callGeminiTranslate(text,fromLang,toLang,roleContext,onPartial) {
  const key=getGeminiKey();
  if(!key) { const error=new Error('NO_KEY'); error.code='NO_KEY'; throw error; }
  const start=performance.now();
  const myRole=roleText[roleContext?.myRole] || 'Anh';
  const peerRole=roleText[roleContext?.peerRole] || 'Em';
  const system=GEMINI_SYSTEM_INSTRUCTION+`\n当前会话人称：说话人自称 ${myRole}，对方称 ${peerRole}。`;
  const body={
    system_instruction:{parts:[{text:system}]},
    contents:[{parts:[{text}]}],
    generationConfig:{temperature:0.3,maxOutputTokens:512}
  };
  const models=[getGeminiModel(),GEMINI_PRIMARY_MODEL,GEMINI_FALLBACK_MODEL].filter((model,index,list)=>list.indexOf(model)===index);
  let lastError=null;
  for(const model of models) {
    try {
      let translated='';
      try { translated=await requestGemini(model,key,body,true,text=>onPartial?.(text)); }
      catch(streamError) {
        if(streamError.status===404) throw streamError;
        translated=await requestGemini(model,key,body,false);
      }
      if(!translated) throw new Error('Gemini 返回空译文');
      saveGeminiModel(model);
      return {text:translated,ms:Math.round(performance.now()-start),model};
    } catch(error) {
      lastError=error;
      if(error.status===404) continue; // 该模型已下线，换下一个模型重试
      break; // Key 无效、限流、网络问题：不再换模型
    }
  }
  throw lastError || new Error('Gemini 翻译失败');
}
async function requestGeminiTranslation(payload,onPartial) {
  const result=await callGeminiTranslate(payload.sourceText,payload.fromLang,payload.toLang,payload.honorificProfile || defaultContext,text=>onPartial?.(text));
  return result.text;
}

// Native bridge can return a WK reply Promise or call completeNative(requestId, {translatedText}, error).
// Cloud contract: POST JSON, then JSON {translatedText} or SSE/NDJSON events {delta|translatedText,isFinal}.
const TranslationEngine=platform.TranslationEngine={
  // GitHub Pages has no translation API. A backend deployment can opt in explicitly.
  enableCloud(enabled=true) { cloudTranslationEnabled=enabled===true; },
  completeNative(requestId,result,error) {
    nativeRequests.get(requestId)?.(result,error?new Error(String(error)):null);
  },
  async translate(payload,{fallback,onPartial,offline=false}={}) {
    const start=performance.now();
    const result=(text,route)=>({text,route,elapsedMs:Math.round(performance.now()-start)});
    if(!offline) {
      const bridge=platform.webkit?.messageHandlers?.nativeTranslate;
      if(typeof bridge?.postMessage==='function') {
        try {
          const text=translatedText(await requestNativeTranslation(bridge,payload));
          if(text) return result(text,'native');
        } catch {}
      }
      if(getGeminiKey() && /^https?:$/.test(platform.location?.protocol || '') && typeof platform.fetch==='function') {
        try {
          const text=await requestGeminiTranslation(payload,onPartial);
          if(text) return result(text,'gemini');
        } catch {}
      }
      if(cloudTranslationEnabled && /^https?:$/.test(platform.location?.protocol || '') && typeof platform.fetch==='function') {
        try {
          const text=await requestCloudTranslation(payload,onPartial);
          if(text) return result(text,'cloud');
        } catch {}
      }
    }
    return result(fallback?.() || demoTranslation({
      text:payload.sourceText,sourceLanguage:payload.fromLang,context:payload.honorificProfile || defaultContext
    }),'local');
  },
  receiveMessage({remotePeerId,sourceText,fromLang}) {
    const person=find(remotePeerId);
    if(!person || typeof sourceText!=='string' || !sourceText.trim() || !['zh','vi'].includes(fromLang)) return false;
    const message=[fromLang,sourceText.trim().slice(0,500),'',clock(),person.name,{received:true}];
    (state.sent[person.id] ||= []).push(message);
    attachMessageTranslation(person,message,'');
    refreshDemoReply(person);
    return true;
  }
};
const liveTranslations=new Map();
function attachMessageTranslation(person,message,fallback) {
  const [lang,text,,,,meta]=message;
  const payload={sourceText:text,fromLang:lang,toLang:otherLanguage(lang),honorificProfile:meta.context || conversationContext(person.id)};
  const hasRemote=!operationOffline()&&(typeof platform.webkit?.messageHandlers?.nativeTranslate?.postMessage==='function'||getGeminiKey()||(cloudTranslationEnabled && /^https?:$/.test(platform.location?.protocol || '')));
  if(!hasRemote && !meta.received) {
    meta.translationRoute='local';
    const start=performance.now();
    message[2]=fallback || demoTranslation(translationPayload(person,text,lang));
    meta.translationMs=Math.round(performance.now()-start);
    return;
  }
  liveTranslations.set(meta,'');
  let nextPaint=0;
  void TranslationEngine.translate(payload,{fallback:()=>fallback,offline:operationOffline(),onPartial:text=>{
    liveTranslations.set(meta,text);
    if(performance.now()>=nextPaint) {
      nextPaint=performance.now()+80;
      refreshDemoReply(person);
    }
  }}).then(result=>{
    liveTranslations.delete(meta);
    message[2]=result.text;
    meta.translationRoute=result.route;
    meta.translationMs=result.elapsedMs;
    refreshDemoReply(person);
  }).catch(()=>{
    liveTranslations.delete(meta);
    refreshDemoReply(person);
  });
}

// Configure on the deployed host: connect({remotePeerId, peerConnection, dataChannel, signal})
// negotiates SDP/ICE with your signaling service and may return a disconnect function.
// Timestamp is milliseconds relative to call start or an epoch timestamp.
let rtcAdapter=null;
const CallManager=platform.CallManager={
  configure(adapter) {
    if(adapter!==null && typeof adapter?.connect!=='function') throw new TypeError('CallManager.configure expects a connect adapter');
    rtcAdapter=adapter;
  },
  startCall(remotePeerId,{video=true}={}) {
    return openCall(remotePeerId,video?'video':'voice');
  },
  endCall() { closeCall(); },
  attachDataChannel(channel) {
    if(!state.call || typeof channel?.addEventListener!=='function') return false;
    const call=state.call;
    const receive=event=>receiveCaption(call,event.data);
    channel.addEventListener('message',receive);
    (call.channelCleanup ||= []).push(()=>{
      channel.removeEventListener('message',receive);
      channel.close?.();
    });
    return true;
  },
  getCaptionHistory() {
    return state.call?sortedCaptions(state.call).map(item=>({...item})):[];
  }
};

function sortedCaptions(call) {
  return [...(call.finalCaptions?.values() || [])].sort((a,b)=>a.timestamp-b.timestamp || a.segmentId.localeCompare(b.segmentId));
}
function receiveCaption(call,data) {
  if(state.call!==call) return;
  let item;
  try {
    if(typeof data==='string' && data.length>16000) return;
    item=typeof data==='string'?JSON.parse(data):data;
  } catch {return;}
  if(!item || typeof item.segmentId!=='string' || !item.segmentId || item.segmentId.length>128 ||
    typeof item.sourceText!=='string' || item.sourceText.length>4000 ||
    typeof item.translatedText!=='string' || item.translatedText.length>4000 ||
    !Number.isFinite(item.timestamp) || item.timestamp<0 || typeof item.isFinal!=='boolean') return;
  const {segmentId,sourceText,translatedText,isFinal,timestamp}=item;
  if(call.finalCaptions.has(segmentId)) return;
  const existing=call.captionDrafts.get(segmentId);
  if(!isFinal && existing && existing.item.timestamp>timestamp) return;
  if(!isFinal && !existing && call.captionDrafts.size>=64) return;
  clearTimeout(existing?.timer);
  const clean={segmentId,sourceText,translatedText,isFinal,timestamp};
  if(isFinal) {
    call.captionDrafts.delete(segmentId);
    call.finalCaptions.set(segmentId,clean);
    if(call.finalCaptions.size>1000) call.finalCaptions.delete(sortedCaptions(call)[0].segmentId);
    call.captionRevision++;
    updateCall();
  } else {
    const draft={item:clean,visible:existing?.visible};
    draft.timer=setTimeout(()=>{
      if(state.call!==call || call.captionDrafts.get(segmentId)!==draft) return;
      draft.visible=draft.item;
      call.captionRevision++;
      updateCall();
    },200);
    call.captionDrafts.set(segmentId,draft);
  }
}
function renderRtcCaptions(call) {
  if(!call.captions) return;
  const area=document.querySelector('.caption-scroll');
  const rows=document.querySelector('#caption-rows');
  if(rows.dataset.rtcRevision===String(call.captionRevision) && !call.resumeFollow) return;
  const rendered=rows.dataset.rtcRevision!==undefined;
  const follow=call.resumeFollow || (!call.followPaused && (rendered?captionsAtBottom(area):call.captionPosition?.follow ?? true));
  call.resumeFollow=false;
  const draft=[...call.captionDrafts.values()].map(entry=>entry.visible).filter(Boolean).sort((a,b)=>a.timestamp-b.timestamp);
  rows.innerHTML=[...sortedCaptions(call),...draft].map(item=>`<div class="caption-pair"><p class="hud-source-text hud-source">${escape(item.sourceText)}</p><p class="hud-target-text hud-target">${escape(item.translatedText)}</p></div>`).join('');
  rows.dataset.rtcRevision=call.captionRevision;
  if(follow) area.scrollTop=area.scrollHeight;
  else if(!rendered) area.scrollTop=call.captionPosition?.top || 0;
}

function releaseRtc(call) {
  call.abortController?.abort();
  for(const entry of call.captionDrafts.values()) clearTimeout(entry.timer);
  for(const cleanup of call.channelCleanup || []) cleanup();
  for(const track of call.localStream?.getTracks() || []) track.stop();
  call.connection?.close();
  try {call.disconnect?.();} catch {}
}
async function connectRtc(call,adapter) {
  if(!platform.isSecureContext || !platform.RTCPeerConnection || !platform.navigator?.mediaDevices?.getUserMedia) {
    call.rtcError=true; render(); return;
  }
  try {
    call.abortController=new AbortController();
    const local=await platform.navigator.mediaDevices.getUserMedia({audio:true,video:call.kind==='video'});
    if(state.call!==call) {local.getTracks().forEach(track=>track.stop());return;}
    call.localStream=local;
    const pc=new platform.RTCPeerConnection(adapter.rtcConfiguration);
    call.connection=pc;
    for(const track of local.getTracks()) pc.addTrack(track,local);
    bindRtcMedia(call);
    pc.addEventListener('track',event=>{
      if(state.call!==call) return;
      if(!call.remoteStream) call.remoteStream=event.streams[0] || new MediaStream();
      if(!call.remoteStream.getTracks().includes(event.track)) call.remoteStream.addTrack(event.track);
      bindRtcMedia(call);
    });
    pc.addEventListener('datachannel',event=>{
      if(state.call===call && event.channel.label==='subtitles') CallManager.attachDataChannel(event.channel);
    });
    pc.addEventListener('connectionstatechange',()=>{
      if(state.call!==call) return;
      call.rtcConnected=pc.connectionState==='connected';
      call.rtcError=pc.connectionState==='failed' || pc.connectionState==='closed';
      render();
    });
    const channel=pc.createDataChannel('subtitles');
    CallManager.attachDataChannel(channel);
    const disconnect=await adapter.connect({remotePeerId:call.person,peerConnection:pc,dataChannel:channel,signal:call.abortController.signal});
    if(typeof disconnect==='function') {
      if(state.call===call) call.disconnect=disconnect;
      else disconnect();
    }
  } catch {
    if(state.call!==call) return;
    call.rtcError=true;
    releaseRtc(call);
    render();
  }
}
function bindRtcMedia(call) {
  const media=document.querySelector('#remote-call-media');
  if(media && call.remoteStream) {
    if(media.srcObject!==call.remoteStream) media.srcObject=call.remoteStream;
    media.muted=!call.speaker;
    void media.play?.()?.catch(()=>{});
  }
  for(const track of call.localStream?.getTracks() || []) track.enabled=track.kind==='audio'?call.mic:call.camera;
}
function openCall(person,kind) {
  if(state.call || !find(person)) return false;
  state.call={person,kind,start:Date.now(),mic:true,speaker:true,captions:state.callPreferences.captions,
    followPaused:!state.callPreferences.follow,camera:kind==='video',voiceCount:1,voiceTimes:[0],nextTurn:4,
    rtcMode:!!rtcAdapter,captionRevision:0,finalCaptions:new Map(),captionDrafts:new Map()};
  state.history.unshift({id:person,kind,time:clock()});
  state.history=state.history.slice(0,20);
  save('history',state.history);
  render();
  timer=setInterval(updateCall,500);
  if(rtcAdapter) void connectRtc(state.call,rtcAdapter);
  return true;
}
function closeCall() {
  const call=state.call;
  if(!call) return;
  clearInterval(timer);
  const elapsed=Math.floor((Date.now()-call.start)/1000);
  const times=call.kind==='voice'?call.voiceTimes:Array.from({length:1+Math.floor(elapsed/4)},(_,index)=>index*4);
  const turns=call.rtcMode?sortedCaptions(call).map(item=>{
    const offset=item.timestamp>=1e12?item.timestamp-call.start:item.timestamp;
    return [Math.max(0,Math.floor(offset/1000)),/\p{Script=Han}/u.test(item.sourceText)?'zh':'vi',item.sourceText,item.translatedText];
  }):times.map((time,index)=>[time,...lines[index%lines.length]]);
  state.pendingTranscript=state.titanium.cache==='discard' || !turns.length?null:{person:call.person,kind:call.kind,turns,live:call.rtcMode};
  state.call=null;
  releaseRtc(call);
  render({preserve:true});
}

function updateCall() {
  const call=state.call;
  if (!call) return;
  const elapsed=Math.floor((Date.now()-call.start)/1000);
  document.querySelector('#call-time').textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;
  if(call.rtcMode) {renderRtcCaptions(call);return;}
  let count=1+Math.floor(elapsed/4);
  if(call.kind==='voice') {
    if(!call.noise && !call.holding && call.mic && elapsed>=call.nextTurn) {
      call.voiceCount++;
      call.voiceTimes.push(elapsed);
      call.nextTurn=elapsed+4;
    }
    count=call.voiceCount;
    const [lang]=lines[(count-1)%lines.length];
    const turn=document.querySelector('#voice-language');
    if(turn) {
      const speaker=lang==='zh'?t('你','Bạn'):label(find(call.person));
      const status=call.holding?t('正在按住说话 · 演示','Đang giữ để nói · Demo'):`${speaker} · ${t('识别','Nhận diện')} ${languageName(lang)} · ${t('演示','Demo')}`;
      if(turn.textContent!==status) turn.textContent=status;
    }
  }
  if (!call.captions) return;
  const area=document.querySelector('.caption-scroll');
  const rows=document.querySelector('#caption-rows');
  const rendered=Number(rows.dataset.count || 0);
  if (rendered===count) {
    if(call.resumeFollow) { area.scrollTop=area.scrollHeight; call.resumeFollow=false; }
    return;
  }

  // Measure before appending so incoming lines do not change follow mode.
  const follow=call.resumeFollow || (!call.followPaused && (rendered ? captionsAtBottom(area) : call.captionPosition?.follow ?? true));
  call.resumeFollow=false;
  const markup=Array.from({length:count-rendered},(_,index)=>{
    const [lang,original,translation]=lines[(rendered+index)%lines.length];
    const [vi,zh]=lang==='vi'?[original,translation]:[translation,original];
    return `<div class="caption-pair"><p class="hud-source-text hud-source" lang="vi">${vi}</p><p class="hud-target-text hud-target" lang="zh-CN">${zh}</p></div>`;
  }).join('');
  rows.insertAdjacentHTML('beforeend',markup);
  rows.dataset.count=count;
  if (follow) area.scrollTop=area.scrollHeight;
  else if (!rendered) area.scrollTop=call.captionPosition?.top || 0;
}
function captionsAtBottom(area) {
  return area.scrollHeight-area.clientHeight-Math.max(0,area.scrollTop)<=4;
}

  </div>${transcriptPrompt()}${state.toast?`<div class="titanium-toast" role="status">${escape(state.toast)}</div>`:''}`;
  if(state.pendingTranscript) root.querySelector('[data-transcript-action="cancel"]')?.focus();
  const timeline=document.querySelector('.timeline');
  if(timeline) {
    if(state.scrollLatest) {
      const latest=timeline.lastElementChild;
      if(latest?.scrollIntoView && timeline.clientHeight) {
        latest.scrollIntoView({block:'end',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      } else timeline.scrollTop=timeline.scrollHeight;
    }
    else if(preserve) timeline.scrollTop=oldScroll;
    state.scrollLatest=false;
  }
  if(preserve && oldSection) document.querySelector('.section-page').scrollTop=oldSectionScroll;
  if(preserve && timeline) {
    const input=document.querySelector('#message-form input');
    input.value=draft;
    if(hadComposerFocus) {
      input.focus({preventScroll:true});
      input.setSelectionRange(previousInput.selectionStart, previousInput.selectionEnd);
    }
  }
  const commentInput=document.querySelector('#comment-form input');
  if(preserve && commentInput) commentInput.value=commentDraft;
}

let timer, toastTimer;
function notify(text) {
  clearTimeout(toastTimer);
  state.toast=text;
  render({preserve:true});
  toastTimer=setTimeout(()=>{state.toast='';root.querySelector('.titanium-toast')?.remove();},2400);
}
async function copyProfileId() {

}
root.addEventListener('click', event => {

  if(d.chat) {
    state.messageMenu=false; state.friendPanel=null; state.voiceDraft=null;
    if(state.tab!=='messages') { state.filter='all'; state.search=''; }
    if(matchMedia('(max-width: 950px)').matches) state.details=false;
    state.active=d.chat; state.tab='messages'; state.mobileChat=true; state.picker=false;
    state.read[d.chat]=true; save('read',state.read); render({enterChat:true});
  }
  if(d.filter) { state.filter=d.filter; render({preserve:true}); }
  if('back' in d) { state.voiceDraft=null; state.mobileChat=false; render(); }

  if('offline' in d) { state.offlineDemo=!state.offlineDemo; render({preserve:true}); }
  if('recordVoice' in d) { state.voiceDraft=state.active; render({preserve:true}); }
  if('cancelVoice' in d) { state.voiceDraft=null; render({preserve:true}); }
  if('sendVoice' in d && state.voiceDraft===state.active) {
    state.voiceDraft=null;
    const [lang,original,translation]=demoVoice;
    queueDemoMessage(original,lang,translation,true);
  }
  if(d.playVoice!==undefined) playOrStopVoice(control);
  if(d.copyTranscript!==undefined) void copyTranscript(control,Number(d.copyTranscript));
  if(d.messageTranslate!==undefined) {
    const key=state.active+':'+d.messageTranslate;
    state.expanded[key]=d.messageOpen!=='true';
    render({preserve:true});
  }
  if(d.retryTranslation!==undefined) {
    const key=state.active+':'+d.retryTranslation;
    const person=find(state.active);
    const message=messages(person)[Number(d.retryTranslation)];
    state.translationErrors[key]=operationOffline();
    if(message?.[5] && !state.translationErrors[key] && !liveTranslations.has(message[5])) {
      attachMessageTranslation(person,message,message[2]);
    }
    render({preserve:true});
  }
  if(d.retrySend!==undefined) {
    const person=find(state.active);
    const message=state.sent[person.id]?.[Number(d.retrySend)];
    if(message) sendDemoMessage(person,message);
  }
  if('location' in d && state.feedMode==='nearby' && state.locationStatus!=='pending') {
    const finish=status=>{
      state.locationStatus=status;
      if(state.tab==='feed' && state.feedMode==='nearby') render({preserve:true});
    };
    if(!globalThis.navigator?.geolocation) finish('unavailable');
    else {
      finish('pending');
      navigator.geolocation.getCurrentPosition(()=>finish('allowed'),error=>finish(error.code===1?'denied':'unavailable'),{timeout:8000});
    }
  }
  if('translate' in d) { state.translated[state.active]=state.translated[state.active]===false; render({preserve:true}); }
  if('emojiPicker' in d) { state.picker=!state.picker; render({preserve:true}); }
  if(d.emoji) {
    const draft=document.querySelector('#message-form input').value;
    state.picker=false; render({preserve:true});
    const input=document.querySelector('#message-form input');
    input.value=(draft+d.emoji).slice(0,500); input.focus();
  }
  if(d.callPreference) {
    state.callPreferences[d.callPreference]=!state.callPreferences[d.callPreference];
    save('call-preferences',state.callPreferences);
    render({preserve:true});
  }
  if('unreadBadges' in d) {
    state.unreadBadges=!state.unreadBadges;
    save('unread-badges',state.unreadBadges);
    render({preserve:true});
  }
  if(d.profilePage) {
    if(d.profilePage==='qr') state.qrBack=state.profilePage;
    state.profilePage=d.profilePage;
    render();
  }
  if(d.titaniumSetting) {
    state.titanium[d.titaniumSetting]=d.settingValue;
    save('titanium',state.titanium);
    render({preserve:true});
  }
  if('downloadQr' in d) downloadProfileQr();
  if('copyId' in d) void copyProfileId();
  if('clearCache' in d) {
    state.translationCache=[];
    save('translation-cache',state.translationCache);
    notify(t('翻译缓存已清空','Đã xóa bộ nhớ đệm bản dịch'));
  }
  if('testEngine' in d) void testGeminiEngine();
  if('showEngineKey' in d) {
    const input=document.querySelector('#gemini-key-input');
    if(!input) return;
    const show=input.type==='password';
    input.type=show?'text':'password';
    control.textContent=show?t('隐藏','Ẩn'):t('显示','Hiện');
  }
  if('clearEngineKey' in d) {
    save('gemini-api-key','');
    state.engineTest=null;
    render({preserve:true});
    notify(t('Gemini Key 已清除','Đã xóa Gemini Key'));
  }
  if('signOut' in d || 'resumeDemo' in d) {
    state.signedOut='signOut' in d;
    save('signed-out',state.signedOut);
    render();
  }
  if(d.lang) { state.lang=d.lang; save('lang',state.lang); render({preserve:true}); }
  if(d.feedMode) { state.feedMode=d.feedMode; state.comment=null; render(); }
  if('messageMenu' in d) {
    state.messageMenu=!state.messageMenu;
    render({preserve:true});
    document.querySelector('[data-message-menu]')?.focus();
  }
  if(d.friendPanel) {
    state.messageMenu=false;
    state.friendPanel=d.friendPanel==='close'?null:d.friendPanel;
    state.friendQuery='';
    render({preserve:true});
    document.querySelector('.friend-panel')?.scrollIntoView({block:'nearest'});
  }
  if(d.scan) {
    state.tab='contacts'; state.friendPanel='add'; state.friendQuery=d.scan;
    render({preserve:true});
  }
  if(d.friend && friendDirectory.some(person=>person.id===d.friend)) {
    const status=state.friends[d.friend];
    if (!status || status==='incoming') {
      state.friends[d.friend]=status==='incoming'?'friend':'sent';
      save('friends',state.friends);
      if(status==='incoming') { state.friendPanel='add'; state.friendQuery=d.friend; }

  if(d.postTranslate) { state.postTranslated[d.postTranslate]=!state.postTranslated[d.postTranslate]; render({preserve:true}); }
  if(d.like) { state.likes[d.like]=!state.likes[d.like]; save('likes',state.likes); render({preserve:true}); }
  if(d.comment) {
    state.comment=state.comment===d.comment?null:d.comment;
    render({preserve:true}); document.querySelector('#comment-form input')?.focus();
  }
  if(d.call) openCall(d.person,d.call);
  if('captionSize' in d) {
    state.call.captionSize=((state.call.captionSize || 0)+1)%3;
    render();
  }
  if('captionFollow' in d) {
    state.call.followPaused=!state.call.followPaused;
    state.call.resumeFollow=!state.call.followPaused;
    render();
  }
  if('noise' in d) {
    state.call.noise=!state.call.noise;
    render();
  }
  if(d.control) { state.call[d.control]=!state.call[d.control]; render(); root.querySelector(`[data-control="${d.control}"]`).focus(); }
  if('end' in d) closeCall();
  if(d.transcriptAction && state.pendingTranscript) {
    const {person,kind,turns,live}=state.pendingTranscript;
    state.pendingTranscript=null;
    if(d.transcriptAction==='save') {
      (state.sent[person] ||= []).push(['zh','双语通话文字记录','Bản ghi cuộc gọi song ngữ',clock(),'self',{transcript:{kind,turns,live}}]);
      save('messages',state.sent);
      state.tab='messages'; state.active=person; state.mobileChat=true; state.scrollLatest=true; state.details=false;
    }
    render({preserve:d.transcriptAction==='cancel'});
  }
});
function holdVoice(control, held, commit=false) {
  const call=state.call;
  if(!call || call.kind!=='voice' || (!call.mic && held) || call.holding===held) return;
  call.holding=held;
  control.setAttribute('aria-pressed',String(held));
  if(!held && commit && call.mic) {
    call.voiceCount++;
    const elapsed=Math.floor((Date.now()-call.start)/1000);
    call.voiceTimes.push(elapsed);
    call.nextTurn=elapsed+4;
  }
  updateCall();
}
root.addEventListener('pointerdown',event=>{
  const control=event.target.closest('[data-hold-talk]');
  if(!control || event.button!==0) return;
  control.setPointerCapture(event.pointerId);
  holdVoice(control,true);
});
for(const type of ['pointerup','pointercancel','lostpointercapture']) root.addEventListener(type,event=>{
  const control=event.target.closest('[data-hold-talk]');
  if(control) holdVoice(control,false,type==='pointerup');
});
root.addEventListener('keydown',event=>{
  if(event.code!=='Space' || !event.target.matches('[data-hold-talk]')) return;
  event.preventDefault();
  if(!event.repeat) holdVoice(event.target,true);
});
root.addEventListener('keyup',event=>{
  if(event.code!=='Space' || !event.target.matches('[data-hold-talk]')) return;
  event.preventDefault();
  holdVoice(event.target,false,true);
});
root.addEventListener('change', event=>{
  const {contextKey,contextChat}=event.target.dataset;
  if(contextKey && contextChat===state.active) {
    const value=event.target.value;
    const valid=contextKey==='style'?['dating','daily'].includes(value):
      ['myRole','peerRole'].includes(contextKey)&&['anh','em','ban'].includes(value);
    if(valid) {
      state.conversationContexts[contextChat]={...conversationContext(contextChat),[contextKey]:value};
      save('conversation-contexts',state.conversationContexts);
    }
    return;
  }
  if('groupViewer' in event.target.dataset) {
    state.groupViewer[state.active]=event.target.value;
    render({preserve:true});
    return;
  }
  const member=event.target.dataset.memberLanguage;
  if(!member) return;
  (state.groupLanguages[state.active] ||= {})[member]=event.target.value;
  save('group-languages',state.groupLanguages);
  render({preserve:true});
});
root.addEventListener('input', event => {
  if(event.target.id==='search') { state.search=event.target.value; document.querySelector('.threads').innerHTML=listRows(); }
  if(event.target.id==='gemini-key-input') save('gemini-api-key',event.target.value);
});
root.addEventListener('submit', event => {
  event.preventDefault();
  if(event.target.id==='friend-search') {
    state.friendQuery=event.target.elements.query.value;
    render({preserve:true});
  }
  if(event.target.id==='message-form') {
    const input=event.target.elements.message;
    const message=input.value.trim();
    if(!message) return;
    const match=phrases.find(pair=>pair.some(phrase=>phrase.toLowerCase()===message.replace(/[。！!?！.]+$/u,'').toLowerCase()));
    const lang=/\p{Script=Han}/u.test(message)?'zh':(match?'vi':state.lang);
    input.value='';
    if(!getGeminiKey() && !engineKeyToastShown) {
      engineKeyToastShown=true;
      notify(t('请先在设置中填入免费 Gemini Key','Vui lòng nhập Gemini Key miễn phí trong phần cài đặt'));
    }
    const payload=translationPayload(find(state.active),message,lang);
    const key=JSON.stringify(payload.context);
    const cached=state.translationCache.find(row=>row[0]===lang&&row[1]===message&&row[3]===key);
    queueDemoMessage(message,lang,cached?.[2]||demoTranslation(payload),false,payload);
  }
  if(event.target.id==='comment-form') {
    const value=event.target.elements.comment.value.trim();
    if(!value) return;
    (state.comments[state.comment] ||= []).push(['self',value]);
    save('comments',state.comments); event.target.elements.comment.value=''; render({preserve:true});
    document.querySelector('#comment-form input').focus();
  }
});
function installManifest() {
  if(!document.head || !/^https?:$/.test(platform.location?.protocol || '')) return;
  const start=new URL(platform.location.href);
  start.hash='';
  const scope=new URL('./',start);
  const icon='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#090B0E"/><path d="M122 170h268v150H240l-75 58v-58h-43z" fill="none" stroke="#D8B56D" stroke-width="18" stroke-linejoin="round"/><path d="M184 224h144m-144 43h104" stroke="#D8B56D" stroke-width="16" stroke-linecap="round"/></svg>';
  const manifest={
    id:start.pathname,name:brandName,short_name:'夜语',start_url:start.href,scope:scope.href,
    display:'standalone',orientation:'portrait',background_color:'#090B0E',theme_color:'#090B0E',
    icons:[{src:'data:image/svg+xml,'+encodeURIComponent(icon),sizes:'any',type:'image/svg+xml',purpose:'any'}]
  };
  const link=document.createElement('link');
  link.rel='manifest';link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
  document.head.append(link);
  const touchIcon=document.createElement('link');
  touchIcon.rel='apple-touch-icon';touchIcon.href=manifest.icons[0].src;
  document.head.append(touchIcon);
}
installManifest();
function keepComposerVisible() {
  const input=document.activeElement;
  if(!input?.matches?.('#message-form input')) {
    document.documentElement.style?.removeProperty('--chat-viewport-height');
    return;
  }
  const viewport=globalThis.visualViewport;
  if(viewport && matchMedia('(max-width: 768px), (max-width: 950px) and (pointer: coarse)').matches) {
    const height=Math.round(viewport.height+viewport.offsetTop);
    document.documentElement.style?.setProperty('--chat-viewport-height',`${height}px`);
    const composer=input.closest('.composer');
    const timeline=document.querySelector('.timeline');
    const align=()=>{
      if(document.activeElement!==input) return;
      if(composer && composer.getBoundingClientRect().bottom>height+1) composer.scrollIntoView({block:'nearest',behavior:'auto'});
      if(timeline) timeline.scrollTop=timeline.scrollHeight;
    };
    if(typeof platform.requestAnimationFrame==='function') platform.requestAnimationFrame(align); else align();
  }
}
root.addEventListener('focusin',event=>{
  if(event.target.matches?.('#message-form input')) keepComposerVisible();
});
root.addEventListener('focusout',event=>{
  if(event.target.matches?.('#message-form input')) queueMicrotask(keepComposerVisible);
});
globalThis.visualViewport?.addEventListener('resize',keepComposerVisible);
globalThis.visualViewport?.addEventListener('scroll',keepComposerVisible);
voiceEngine?.addEventListener?.('voiceschanged',refreshLocalVoices);
refreshLocalVoices();
render();
